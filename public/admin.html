function loadDB() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        // Tetap jalankan migrateDB() walau database masih kosong (kunjungan pertama),
        // supaya halaman kustom bawaan (mis. "Fasilitas Sekolah") ikut disinkronkan
        // ke pageOrder. Tanpa ini, applyPageOrder() akan melewati halaman tersebut
        // dan secara tidak sengaja membuatnya "terdorong" ke posisi paling atas.
        if (!raw) return migrateDB(JSON.parse(JSON.stringify(DEFAULT_DB)));
        const parsed = JSON.parse(raw);
        // merge shallow supaya field baru dari DEFAULT_DB tetap ada jika versi lama
        const merged = Object.assign({}, DEFAULT_DB, parsed);
        return migrateDB(merged);
    } catch (e) {
        console.error('Gagal memuat data CMS, menggunakan default.', e);
        return migrateDB(JSON.parse(JSON.stringify(DEFAULT_DB)));
    }
}

// Menyesuaikan data lama (format sebelumnya) ke skema terbaru agar tidak error/kosong.
function migrateDB(db) {
    // Testimoni: versi lama berupa objek tunggal -> larik, dan pastikan selalu larik.
    if (db.testimoni && !Array.isArray(db.testimoni)) {
        db.testimoni = [db.testimoni];
    }
    // PERBAIKAN BUG: sebelumnya baris ini JUGA mereset ke data contoh
    // bawaan kalau db.testimoni.length === 0 -- artinya begitu admin
    // MENGHAPUS semua testimoni sampai habis (sengaja, memang mau kosong),
    // reload halaman admin berikutnya akan MENGEMBALIKAN data contoh
    // bawaan seolah-olah penghapusannya tidak pernah terjadi. Sekarang
    // cuma direset kalau field-nya benar-benar bukan larik sama sekali
    // (data korup/belum pernah ada) -- larik kosong yang memang disengaja
    // TETAP kosong.
    if (!Array.isArray(db.testimoni)) {
        db.testimoni = JSON.parse(JSON.stringify(DEFAULT_DB.testimoni));
    }
    if (!db.testimoniHeader) {
        db.testimoniHeader = JSON.parse(JSON.stringify(DEFAULT_DB.testimoniHeader));
    }

    // Prestasi: versi lama pakai field name/kelas/achievement/level/year/icon -> foto/badge/date/title/studentName.
    if (Array.isArray(db.prestasi)) {
        db.prestasi = db.prestasi.map(p => {
            if (!p) return p;
            const isOldSchema = p.title === undefined && (p.achievement !== undefined || p.name !== undefined);
            if (!isOldSchema) return p;
            return {
                photo: p.photo || '',
                badge: p.badge || 'PENCAPAIAN',
                date: p.date || (p.year ? String(p.year) : ''),
                title: p.achievement || '',
                studentName: p.name || ''
            };
        });
    }

    // Hero: dukung banyak gambar (carousel) — migrasi dari field lama `image` (tunggal).
    if (!db.hero) db.hero = JSON.parse(JSON.stringify(DEFAULT_DB.hero));
    // PERBAIKAN BUG (sama seperti testimoni di atas): jangan reset ke foto
    // contoh bawaan kalau db.hero.images memang SUDAH larik (walau
    // kosong) -- itu berarti admin sengaja menghapus semua foto hero.
    // Cuma migrasikan/isi default kalau field-nya belum pernah berbentuk
    // larik sama sekali.
    if (!Array.isArray(db.hero.images)) {
        db.hero.images = db.hero.image ? [db.hero.image] : JSON.parse(JSON.stringify(DEFAULT_DB.hero.images));
    }
    delete db.hero.image;

    // Meta: pastikan field logo (foto) tersedia untuk versi lama.
    if (!db.meta) db.meta = JSON.parse(JSON.stringify(DEFAULT_DB.meta));
    if (db.meta.logoImage === undefined) db.meta.logoImage = '';

    // Notifikasi Situs: pastikan objek & seluruh field-nya ada untuk data lama.
    if (!db.notification || typeof db.notification !== 'object') {
        db.notification = JSON.parse(JSON.stringify(DEFAULT_DB.notification));
    } else {
        db.notification = Object.assign({}, DEFAULT_DB.notification, db.notification);
    }
    // Migrasi: dulu cuma 1 gambar (field `image` string tunggal), sekarang
    // bisa lebih dari satu (field `images` larik) supaya tampil carousel di
    // modal, sama seperti pola db.hero.images di atas.
    if (!Array.isArray(db.notification.images)) {
        db.notification.images = db.notification.image ? [db.notification.image] : [];
    }
    delete db.notification.image;

    // Berita: pastikan setiap artikel punya id unik (untuk komentar & tautan detail) dan field baru.
    if (Array.isArray(db.berita)) {
        db.berita.forEach((b, i) => {
            if (!b.id) b.id = 'b_legacy_' + i + '_' + Date.now();
            if (b.content === undefined) b.content = b.excerpt || '';
            if (b.tags === undefined) b.tags = '';
        });
    }
    if (!db.beritaComments || typeof db.beritaComments !== 'object') {
        db.beritaComments = {};
    }

    // Halaman/Section kustom tambahan dari admin — pastikan selalu larik yang valid.
    if (!Array.isArray(db.customSections)) {
        db.customSections = [];
    }
    db.customSections.forEach(s => {
        if (!s.id) s.id = 'cs_' + Math.random().toString(36).slice(2, 10);
        if (!Array.isArray(s.items)) s.items = [];
        if (typeof s.active !== 'boolean') s.active = true;
    });

    // Urutan halaman — pastikan selalu berisi seluruh halaman baku yang dikenal,
    // buang key yang sudah tidak dikenal, dan pastikan halaman terkunci (Beranda) ada di posisi pertama.
    if (!Array.isArray(db.pageOrder)) db.pageOrder = [];
    const defaultPageOrder = DEFAULT_DB.pageOrder;
    const validKeys = defaultPageOrder.map(p => p.key);
    // Migrasi lama: sebelumnya "Prestasi" & "Ekstrakurikuler" adalah SATU entri gabungan
    // berkunci "prestasi". Sekarang keduanya section terpisah — pecah entri lama tersebut
    // menjadi dua baris agar bisa diatur urutan & aktif/nonaktifnya masing-masing.
    const prestasiIdx = db.pageOrder.findIndex(p => p && p.key === 'prestasi');
    if (prestasiIdx !== -1) {
        if (db.pageOrder[prestasiIdx].label === 'Prestasi & Ekstrakurikuler') {
            db.pageOrder[prestasiIdx].label = 'Prestasi Siswa';
        }
        if (!db.pageOrder.find(p => p && p.key === 'ekskul')) {
            db.pageOrder.splice(prestasiIdx + 1, 0, {
                key: 'ekskul', label: 'Ekstrakurikuler', icon: 'tent',
                locked: false, active: db.pageOrder[prestasiIdx].active !== false
            });
        }
    }
    // Pertahankan entri halaman kustom (key berawalan "custom:") beserta posisinya —
    // sebelumnya baris ini membuang semua entri kustom sehingga urutannya reset ke
    // bawah setiap kali halaman dimuat ulang. syncCustomPagesIntoOrder() di bawah
    // tetap yang menangani penambahan/penghapusan entri kustom sesuai data terbaru.
    db.pageOrder = db.pageOrder.filter(p => p && (validKeys.includes(p.key) || String(p.key).startsWith(CUSTOM_PAGE_KEY_PREFIX)));
    defaultPageOrder.forEach(def => {
        if (!db.pageOrder.find(p => p.key === def.key)) {
            db.pageOrder.push(Object.assign({}, def));
        }
    });
    db.pageOrder.forEach(p => {
        const def = defaultPageOrder.find(d => d.key === p.key) || {};
        if (!p.label) p.label = def.label;
        if (!p.icon) p.icon = def.icon;
        p.locked = !!def.locked;
        if (typeof p.active !== 'boolean') p.active = true;
        if (p.locked) p.active = true;
    });
    const lockedIdx = db.pageOrder.findIndex(p => p.locked);
    if (lockedIdx > 0) {
        const [lockedItem] = db.pageOrder.splice(lockedIdx, 1);
        db.pageOrder.unshift(lockedItem);
    }
    syncCustomPagesIntoOrder(db);

    return db;
}

// Menyisipkan/menyingkronkan setiap halaman kustom (dari menu "Tambah Halaman") ke dalam
// DB.pageOrder sebagai baris tersendiri, supaya bisa diatur urutan & aktif/nonaktifnya
// bersama halaman baku lainnya di menu "Atur Urutan Halaman". Halaman kustom yang baru
// ditambahkan otomatis muncul di urutan paling bawah; halaman yang dihapus otomatis hilang.
function syncCustomPagesIntoOrder(db) {
    if (!Array.isArray(db.pageOrder)) db.pageOrder = [];
    const list = Array.isArray(db.customSections) ? db.customSections : [];
    const customKeys = list.filter(s => s && s.id).map(s => CUSTOM_PAGE_KEY_PREFIX + s.id);

    // buang entri halaman kustom yang datanya sudah tidak ada (dihapus admin)
    db.pageOrder = db.pageOrder.filter(p => !p.key.startsWith(CUSTOM_PAGE_KEY_PREFIX) || customKeys.includes(p.key));

    // tambahkan entri baru & sinkronkan label/status aktif dari data halaman kustom
    list.forEach(s => {
        if (!s || !s.id) return;
        const key = CUSTOM_PAGE_KEY_PREFIX + s.id;
        const label = (s.title && s.title.trim()) ? s.title.trim() : 'Halaman Kustom';
        let entry = db.pageOrder.find(p => p.key === key);
        if (!entry) {
            db.pageOrder.push({
                key, label, icon: 'layout-template', locked: false,
                active: (typeof s.active === 'boolean' ? s.active : true), custom: true
            });
        } else {
            entry.label = label;
            entry.icon = entry.icon || 'layout-template';
            entry.custom = true;
            if (typeof s.active === 'boolean') entry.active = s.active;
        }
    });
}

/* =========================================================================
   SINKRONISASI (ADMIN) — setiap "Simpan" langsung mengirim data ke server
   SAAT ITU JUGA (tanpa jeda/antrian, tanpa badge status), mengikuti pola
   SIEKSTRASAPA yang sudah terbukti dipakai & di-hosting. Otorisasi memakai
   SESI LOGIN (cookie HttpOnly); kalau sesi tidak/sudah tidak valid, server
   menolak dengan 401 dan admin dilempar ke halaman login.
========================================================================= */
async function pullFromCloud() {
    try {
        const res = await fetch('/api/data', { method: 'GET', credentials: 'same-origin' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        if (remote && typeof remote === 'object' && Object.keys(remote).length > 0) {
            DB = migrateDB(Object.assign({}, DEFAULT_DB, remote));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
            renderAdminSidebarBrand();
            showAdminPanel(typeof currentPanel !== 'undefined' ? currentPanel : 'overview');
        }
    } catch (err) {
        console.error('Gagal mengambil data dari server, memakai data lokal.', err);
    }
}

// Fire-and-forget seperti api.push() di SIEKSTRASAPA — UI TIDAK menunggu untuk
// merender ulang tampilan lokal (supaya tetap terasa instan), TAPI toast
// "berhasil disimpan" sekarang baru muncul SETELAH server benar-benar
// mengonfirmasi PUT /api/data sukses (lewat parameter successMessage),
// bukan langsung saat tombol "Simpan" diklik seperti sebelumnya. Sebelumnya
// admin bisa melihat toast "berhasil disimpan" padahal sesungguhnya gagal
// (sesi habis, jaringan putus, payload kelewat besar, dll) karena toast-nya
// tidak menunggu hasil fetch sama sekali.
function pushToCloudNow(successMessage) {
    fetch('/api/data', {
        method: 'PUT',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(DB)
    }).then(async (res) => {
        if (res.status === 401) {
            showToast('Sesi Anda berakhir. Mengalihkan ke halaman masuk...', 'error');
            setTimeout(() => window.location.replace('/login.html'), 1200);
            return;
        }
        if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.error || ('HTTP ' + res.status));
        }
        if (successMessage) showToast(successMessage);
    }).catch(err => {
        console.error('Gagal menyimpan ke server:', err);
        showToast('Gagal menyimpan ke server (data tetap ada di perangkat ini, coba simpan lagi). ' + err.message, 'error');
    });
}

function saveDB(successMessage) {
    syncCustomPagesIntoOrder(DB);
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    } catch (err) {
        // Cache lokal browser (localStorage) penuh. Ini TIDAK menghalangi
        // penyimpanan sesungguhnya — server (D1) tetap jadi sumber data utama.
        console.error(err);
        showToast('Cache lokal browser ini penuh, tapi perubahan tetap disimpan ke server.', 'error');
    }
    pushToCloudNow(successMessage);
}

function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
}

// Sama seperti escapeJsAttr() di public/index.html: dipakai saat sebuah nilai
// disisipkan ke dalam string JS beratribut tunggal di dalam atribut HTML,
// mis. onclick="fn('${nilai}')". escapeHtml() saja tidak cukup di situ --
// nilai yang mengandung tanda kutip satu (mis. id halaman kustom dari file
// backup yang sudah dimanipulasi) bisa lepas dari string JS 'literal' dan
// menyisipkan JS bebas (stored XSS) begitu admin membuka panel ini.
function escapeJsAttr(str) {
    return escapeHtml(str).replaceAll("'", "\\'");
}

// Tombol mata untuk lihat/sembunyikan isi field password -- membantu
// mengantisipasi salah ketik sebelum submit form. Dipakai generik lewat
// id field + tombolnya sendiri (elemen <button> yang memanggilnya).
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const icon = btn.querySelector('i');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    if (icon) icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
    btn.setAttribute('aria-label', showing ? 'Tampilkan password' : 'Sembunyikan password');
    reInitIcons();
}

function showToast(text, type) {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toast-icon');
    document.getElementById('toast-text').textContent = text;
    icon.setAttribute('data-lucide', type === 'error' ? 'x-circle' : 'check-circle');
    icon.className = type === 'error' ? 'w-5 h-5 text-red-400' : 'w-5 h-5 text-emerald-400';
    reInitIcons();
    toast.classList.remove('translate-y-20', 'opacity-0');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
    }, 2800);
}

/* =========================================================================
   LINK GOOGLE DRIVE — ubah link share Google Drive jadi link gambar langsung
========================================================================= */
function driveDirectUrl(url) {
    if (!url) return url;
    const raw = url.trim();
    const patterns = [
        /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]{10,})/,
        /drive\.google\.com\/thumbnail\?[^#]*[?&]id=([a-zA-Z0-9_-]{10,})/,
        /drive\.google\.com\/uc\?[^#]*[?&]id=([a-zA-Z0-9_-]{10,})/,
        /drive\.google\.com\/open\?[^#]*[?&]id=([a-zA-Z0-9_-]{10,})/,
        /docs\.google\.com\/[a-z]+\/d\/([a-zA-Z0-9_-]{10,})/
    ];
    for (const re of patterns) {
        const m = raw.match(re);
        if (m && m[1]) {
            return `https://lh3.googleusercontent.com/d/${m[1]}`;
        }
    }
    return raw;
}

// Dipanggil dari oninput kolom "URL gambar": otomatis mengonversi link share
// Google Drive menjadi link gambar langsung sebelum dipakai sebagai src/disimpan.
function normalizeImageUrlInput(el) {
    const before = el.value;
    const after = driveDirectUrl(before);
    if (after !== before) {
        el.value = after;
        if (typeof showToast === 'function') {
            showToast('Link Google Drive diubah otomatis jadi link gambar langsung.');
        }
    }
    return el.value;
}

/* =========================================================================
   UPLOAD FOTO — baca file dari perangkat, kompres, simpan sebagai data URL.
   Pola ini mengikuti SIEKSTRASAPA (sudah terbukti dipakai & di-hosting):
   coba kualitas terbaik dulu, kalau hasilnya masih kegedean turunkan
   kualitas bertahap (0.85 -> 0.6 -> 0.4), dan kalau tetap kegedean setelah
   3 percobaan, TOLAK dengan pesan jelas — bukan dipaksa simpan begitu saja.
   Ini mencegah 1 foto "berat" menghabiskan jatah 20MB per simpan di server.
========================================================================= */

// Preset ukuran per konteks — samakan filosofinya dengan SIEKSTRASAPA:
// logo kecil & ketat, foto wajah (guru/testimoni/kepsek) sedang, foto
// banner/konten (hero, galeri, prestasi, section kustom) lebih longgar.
const IMAGE_UPLOAD_PRESETS = {
    logo:   { maxWidth: 256,  quality: 0.85, sizeLimit: 45000  },
    face:   { maxWidth: 400,  quality: 0.85, sizeLimit: 90000  },
    banner: { maxWidth: 1000, quality: 0.85, sizeLimit: 300000 }
};

function resizeImageFile(file, maxWidth, quality, sizeLimit) {
    maxWidth = maxWidth || 900;
    quality = quality || 0.82;
    sizeLimit = sizeLimit || 0; // 0 = tidak ada batas keras (dipertahankan untuk kompatibilitas lama)
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round(height * (maxWidth / width));
                    width = maxWidth;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Coba beberapa tingkat kualitas sampai ukurannya aman (pola SIEKSTRASAPA).
                let dataUrl = canvas.toDataURL('image/jpeg', quality);
                if (sizeLimit && dataUrl.length > sizeLimit) dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                if (sizeLimit && dataUrl.length > sizeLimit) dataUrl = canvas.toDataURL('image/jpeg', 0.4);

                if (sizeLimit && dataUrl.length > sizeLimit) {
                    reject(new Error('TOO_LARGE'));
                    return;
                }
                resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Gagal membaca gambar.'));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Gagal membaca file.'));
        reader.readAsDataURL(file);
    });
}

// Pesan error seragam untuk semua titik upload — bedakan "masih terlalu besar
// setelah dikompres habis-habisan" (TOO_LARGE) dari error teknis lainnya,
// dan dari kegagalan mengunggah ke server (jaringan putus / sesi habis).
function handleImageUploadError(err) {
    if (err && err.message === 'TOO_LARGE') {
        showToast('Foto masih terlalu besar, coba pakai foto lain yang lebih sederhana.', 'error');
    } else if (err && err.message === 'SESSION_EXPIRED') {
        // uploadImageToServer() sudah mengalihkan ke /login.html, tidak perlu toast lagi.
    } else if (err && err.message && err.message !== 'Error') {
        showToast(err.message, 'error');
    } else {
        console.error(err);
        showToast('Gagal memproses foto yang diunggah.', 'error');
    }
}

// BARU: kirim data URL (hasil resizeImageFile, sudah terkompresi) ke server
// untuk disimpan sebagai baris terpisah di tabel `images` (D1) -- lihat
// POST /api/admin/upload-image di src/index.js -- lalu kembalikan URL
// PENDEK-nya (mis. "/img/img_..."). Inilah akar perbaikan masalah "setiap
// simpan apa pun ikut mengirim ulang semua foto" -- field yang disimpan ke
// database sekarang cuma string URL ini, bukan lagi base64 utuh fotonya.
async function uploadImageToServer(dataUrl) {
    const res = await fetch('/api/admin/upload-image', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataUrl: dataUrl })
    });
    if (res.status === 401) {
        window.location.replace('/login.html');
        throw new Error('SESSION_EXPIRED');
    }
    const result = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(result.error || 'Gagal mengunggah foto ke server.');
    return result.url;
}

async function handleImageFileSelect(fileInputEl, targetInputId, previewImgId, preset) {
    const file = fileInputEl.files && fileInputEl.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
        showToast('File yang dipilih bukan gambar.', 'error');
        fileInputEl.value = '';
        return;
    }
    const p = IMAGE_UPLOAD_PRESETS[preset] || IMAGE_UPLOAD_PRESETS.banner;
    const preview = document.getElementById(previewImgId);
    try {
        const dataUrl = await resizeImageFile(file, p.maxWidth, p.quality, p.sizeLimit);
        if (preview) preview.src = dataUrl; // pratinjau instan pakai hasil kompresi lokal
        showToast('Mengunggah foto...');
        const uploadedUrl = await uploadImageToServer(dataUrl);
        // Upload & link URL saling menggantikan (satu sumber foto yang jelas) —
        // begitu upload berhasil, field ini otomatis jadi URL foto (/img/...).
        const targetInput = document.getElementById(targetInputId);
        targetInput.value = uploadedUrl;
        showToast('Foto berhasil diunggah — klik "Simpan" untuk menerapkannya.');
    } catch (err) {
        handleImageUploadError(err);
    } finally {
        fileInputEl.value = '';
    }
}

async function verifySessionOrRedirect() {
    try {
        const res = await fetch('/api/session', { credentials: 'same-origin' });
        if (!res.ok) throw new Error('unauthorized');
        const data = await res.json();
        currentAdminUsername = data.username || 'admin';
        forcePasswordChangeActive = !!data.forcePasswordChange;
        return true;
    } catch (e) {
        window.location.replace('/login.html');
        return false;
    }
}

    try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });

    window.location.replace('/login.html');
}

    const list = DB.pageOrder || [];
    document.getElementById('admin-panel-content').innerHTML = `
        <div class="inst-card p-6 mb-6 bg-blue-50/50 border-blue-100">
            <p class="text-sm text-slateDark leading-relaxed">
                Atur urutan tampilan halaman di situs publik, mulai dari <b>Beranda</b> hingga halaman terakhir — termasuk halaman kustom yang dibuat lewat menu "Tambah Halaman" (ditandai badge <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-50 text-indigo-500">KUSTOM</span>). Geser (drag &amp; drop) ikon <i data-lucide="grip-vertical" class="w-3.5 h-3.5 inline align-text-bottom"></i> pada setiap baris untuk mengubah urutan, atau gunakan tombol panah. Gunakan sakelar status untuk menampilkan atau menyembunyikan halaman dari situs publik dan menu navigasi.
            </p>
        </div>
        <div class="inst-card overflow-hidden">
            <div class="p-5 border-b border-borderLight">
                <p class="text-sm text-slateMuted">Perubahan tersimpan otomatis dan langsung diterapkan ke situs publik.</p>
            </div>
            <div class="divide-y divide-borderLight" id="page-order-list">
                ${list.map((p, i) => pageOrderRowHtml(p, i, list.length)).join('')}
            </div>
        </div>
    `;
    reInitIcons();
    attachPageOrderDragEvents();
}

function pageOrderRowHtml(p, i, total) {
    return `
    <div class="flex items-center gap-4 p-4 hover:bg-slate-50 transition ${p.locked ? 'bg-slate-50/70' : ''}" draggable="${p.locked ? 'false' : 'true'}" data-key="${escapeHtml(p.key)}" data-index="${i}">
        <span class="shrink-0 text-slateMuted ${p.locked ? 'opacity-30 cursor-not-allowed' : 'cursor-grab active:cursor-grabbing'}" title="${p.locked ? 'Beranda selalu berada di urutan pertama' : 'Geser untuk mengubah urutan'}">
            <i data-lucide="grip-vertical" class="w-5 h-5"></i>
        </span>
        <div class="w-9 h-9 rounded-lg bg-blue-50 text-primary flex items-center justify-center shrink-0">
            <i data-lucide="${p.icon || 'file'}" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-slateDark truncate flex items-center gap-2">
                ${escapeHtml(p.label)}
                ${p.custom ? '<span class="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-50 text-indigo-500">KUSTOM</span>' : ''}
            </p>
            ${p.locked ? '<p class="text-xs text-slateMuted">Halaman utama — selalu tampil &amp; berada di urutan pertama</p>' : ''}
        </div>
        <div class="flex items-center gap-1 shrink-0">
            ${p.custom ? `<button onclick="editCustomPageFromOrder('${escapeJsAttr(p.key)}')" class="p-2 text-slateMuted hover:text-primary hover:bg-blue-50 rounded-lg transition" aria-label="Edit halaman kustom"><i data-lucide="pencil" class="w-4 h-4"></i></button>` : ''}
            <button onclick="movePageOrder(${i}, -1)" ${(i <= 1 || p.locked) ? 'disabled' : ''} class="p-2 text-slateMuted hover:text-primary hover:bg-blue-50 rounded-lg transition disabled:opacity-30 disabled:pointer-events-none" aria-label="Naikkan urutan"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
            <button onclick="movePageOrder(${i}, 1)" ${(i === total - 1 || p.locked) ? 'disabled' : ''} class="p-2 text-slateMuted hover:text-primary hover:bg-blue-50 rounded-lg transition disabled:opacity-30 disabled:pointer-events-none" aria-label="Turunkan urutan"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
        </div>
        <button onclick="togglePageOrderActive(${i})" ${p.locked ? 'disabled' : ''} class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${p.active ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slateMuted'} ${p.locked ? 'opacity-60 cursor-not-allowed' : ''}">
            <span class="w-1.5 h-1.5 rounded-full ${p.active ? 'bg-emerald-500' : 'bg-slate-400'}"></span> ${p.active ? 'Tampil' : 'Disembunyikan'}
        </button>
    </div>`;
}

function togglePageOrderActive(i) {
    const item = DB.pageOrder[i];
    if (!item || item.locked) return;
    item.active = !item.active;
    // sinkronkan balik ke data halaman kustom terkait, supaya status di menu "Tambah Halaman" tetap konsisten
    if (item.key.startsWith(CUSTOM_PAGE_KEY_PREFIX)) {
        const id = item.key.slice(CUSTOM_PAGE_KEY_PREFIX.length);
        const cs = (DB.customSections || []).find(s => s.id === id);
        if (cs) cs.active = item.active;
    }
    const msg = item.active ? 'Halaman ditampilkan di situs publik.' : 'Halaman disembunyikan dari situs publik.';
    saveDB(msg);
    renderPanelPageOrder();
}

function editCustomPageFromOrder(key) {
    const id = key.slice(CUSTOM_PAGE_KEY_PREFIX.length);
    const idx = (DB.customSections || []).findIndex(s => s.id === id);
    if (idx === -1) {
        showToast('Halaman kustom tidak ditemukan.', 'error');
        return;
    }
    openCustomSectionEditor(idx);
}

function movePageOrder(i, dir) {
    const list = DB.pageOrder;
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    if (list[i].locked || list[j].locked) return;
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
    saveDB('Urutan halaman diperbarui.');
    renderPanelPageOrder();
}

let dragPageOrderIndex = null;

function attachPageOrderDragEvents() {
    const rows = document.querySelectorAll('#page-order-list [draggable="true"]');
    rows.forEach(row => {
        row.addEventListener('dragstart', () => {
            dragPageOrderIndex = parseInt(row.getAttribute('data-index'), 10);
            row.classList.add('opacity-40');
        });
        row.addEventListener('dragend', () => {
            row.classList.remove('opacity-40');
            dragPageOrderIndex = null;
        });
        row.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        row.addEventListener('drop', (e) => {
            e.preventDefault();
            const targetIndex = parseInt(row.getAttribute('data-index'), 10);
            if (dragPageOrderIndex === null || dragPageOrderIndex === targetIndex) return;
            reorderPageOrder(dragPageOrderIndex, targetIndex);
        });
    });
}

function reorderPageOrder(fromIndex, toIndex) {
    const list = DB.pageOrder;
    if (list[fromIndex].locked || list[toIndex].locked) return;
    const [moved] = list.splice(fromIndex, 1);
    list.splice(toIndex, 0, moved);
    const lockedIdx = list.findIndex(p => p.locked);
    if (lockedIdx > 0) {
        const [lockedItem] = list.splice(lockedIdx, 1);
        list.unshift(lockedItem);
    }
    saveDB('Urutan halaman diperbarui.');
    renderPanelPageOrder();
}

async function handleServiceItemImageSelect(fileInputEl, i) {
    const file = fileInputEl.files && fileInputEl.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
        showToast('File yang dipilih bukan gambar.', 'error');
        fileInputEl.value = '';
        return;
    }
    try {
        const p = IMAGE_UPLOAD_PRESETS.banner;
        const dataUrl = await resizeImageFile(file, p.maxWidth, p.quality, p.sizeLimit);
        tempCustomSectionItems[i].image = dataUrl;
        refreshCustomSectionItemsFields();
        showToast('Mengunggah foto layanan...');
        const uploadedUrl = await uploadImageToServer(dataUrl);
        tempCustomSectionItems[i].image = uploadedUrl;
        refreshCustomSectionItemsFields();
        showToast('Foto layanan berhasil diunggah.');
    } catch (err) {
        handleImageUploadError(err);
    } finally {
        fileInputEl.value = '';
    }
}

    if (s.type === 'cards') {
        s.columns = parseInt(document.getElementById('cs-f-columns').value, 10) || 3;
        s.items = tempCustomSectionItems.filter(it => (it.title && it.title.trim()) || (it.desc && it.desc.trim()));
    }
    if (s.type === 'services') {
        s.columns = parseInt(document.getElementById('cs-f-columns').value, 10) || 3;
        s.items = tempCustomSectionItems.filter(it => it.title && it.title.trim());
    }
    if (s.type === 'gallery') {
        s.items = tempCustomSectionItems.filter(it => it.image && it.image.trim());
    }
    if (s.type === 'cta') {
        s.ctaLabel = document.getElementById('cs-f-cta-label').value;
        s.ctaLink = document.getElementById('cs-f-cta-link').value;
    }

    if (!s.title.trim()) {
        showToast('Judul section wajib diisi.', 'error');
        return;
    }

    if (!DB.customSections) DB.customSections = [];
    if (editingCustomSectionIndex === null) {
        DB.customSections.push(s);
    } else {
        DB.customSections[editingCustomSectionIndex] = s;
    }
    saveDB('Section berhasil disimpan.');
    closeCustomSectionModal();
    renderPanelCustomSections();
}

function onNotifImageUrlInput(el) {
    normalizeImageUrlInput(el);
    const row = el.closest('.notif-image-row');
    const preview = row.querySelector('.notif-image-preview');
    preview.src = el.value;
    preview.classList.toggle('hidden', !el.value);
    const i = Array.from(document.querySelectorAll('.notif-image-url-input')).indexOf(el);
    if (i !== -1) tempNotifImages[i] = el.value;
    renderNotifLivePreview();
}

async function handleNotifImageFileSelect(fileInputEl) {
    const row = fileInputEl.closest('.notif-image-row');
    const urlInput = row.querySelector('.notif-image-url-input');
    const preview = row.querySelector('.notif-image-preview');
    const file = fileInputEl.files && fileInputEl.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
        showToast('File yang dipilih bukan gambar.', 'error');
        fileInputEl.value = '';
        return;
    }
    const p = IMAGE_UPLOAD_PRESETS.banner;
    try {
        const dataUrl = await resizeImageFile(file, p.maxWidth, p.quality, p.sizeLimit);
        preview.src = dataUrl;
        preview.classList.remove('hidden');
        showToast('Mengunggah gambar...');
        const uploadedUrl = await uploadImageToServer(dataUrl);
        urlInput.value = uploadedUrl;
        const i = Array.from(document.querySelectorAll('.notif-image-url-input')).indexOf(urlInput);
        if (i !== -1) tempNotifImages[i] = uploadedUrl;
        renderNotifLivePreview();
        showToast('Gambar berhasil diunggah — klik "Simpan Notifikasi" untuk menerapkannya.');
    } catch (err) {
        handleImageUploadError(err);
    } finally {
        fileInputEl.value = '';
    }
}

// Mini mockup 3 jenis tampilan (modal/banner/badge) di panel kanan --
// dibuat manual (bukan iframe ke situs publik) supaya update-nya instan
// setiap ketikan tanpa perlu simpan dulu, dan tidak tergantung situs publik
// sudah online/tidak.
function renderNotifLivePreview() {
    const wrap = document.getElementById('nf-live-preview');
    if (!wrap) return; // panel belum dirender / sudah pindah halaman

    const type = document.getElementById('nf-type').value;
    const title = document.getElementById('nf-title').value.trim();
    const message = document.getElementById('nf-message').value.trim();
    const images = Array.from(document.querySelectorAll('.notif-image-url-input')).map(el => el.value.trim()).filter(Boolean);
    const image = images[0] || '';
    const ctaLabel = document.getElementById('nf-cta-label').value.trim();
    const iconId = document.getElementById('nf-icon').value;
    const enabled = document.getElementById('nf-enabled').checked;
    const c = NOTIF_COLOR_MAP[iconId] || NOTIF_COLOR_MAP.info;

    if (!enabled) {
        wrap.innerHTML = `<p class="text-xs text-slateMuted text-center px-4">Notifikasi sedang dinonaktifkan — centang "Aktifkan Notifikasi" untuk melihat pratinjau.</p>`;
        return;
    }
    if (!title && !message && !image) {
        wrap.innerHTML = `<p class="text-xs text-slateMuted text-center px-4">Isi judul, pesan, atau gambar untuk melihat pratinjau di sini.</p>`;
        return;
    }

    const ctaHtml = ctaLabel
        ? `<span class="inline-block mt-3 px-4 py-2 rounded-lg text-xs font-semibold text-white" style="background-color:${c.solid}">${escapeHtml(ctaLabel)}</span>`
        : '';

    if (type === 'modal') {
        // Kalau pesan dikosongkan tapi ada gambar -> gambar tampil penuh
        // menggantikan teks (persis perilaku di situs publik).
        const showImageOnly = image && !message;
        wrap.innerHTML = `
            <div class="bg-white rounded-xl shadow-md w-full max-w-[280px] overflow-hidden mx-auto">
                ${image ? `
                <div class="relative">
                    <img src="${escapeHtml(image)}" class="w-full h-32 object-cover">
                    ${images.length > 1 ? `
                    <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 flex gap-1">
                        ${images.map((_, i) => `<span class="h-1 rounded-full ${i === 0 ? 'w-3.5 bg-white' : 'w-1 bg-white/60'}"></span>`).join('')}
                    </div>
                    <span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-full bg-black/50 text-white text-[10px] font-semibold">1/${images.length}</span>
                    ` : ''}
                </div>
                ` : ''}
                <div class="p-3" style="border-top:3px solid ${c.solid}">
                    <div class="flex items-start gap-2">
                        <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style="background-color:${c.bg}">
                            <i data-lucide="${iconId}" class="w-3.5 h-3.5" style="color:${c.solid}"></i>

function selectNotifType(typeId) {
    document.getElementById('nf-type').value = typeId;
    document.querySelectorAll('.notif-type-card').forEach(card => {
        const active = card.getAttribute('data-notif-type') === typeId;
        card.classList.toggle('border-primary', active);
        card.classList.toggle('bg-blue-50', active);
        card.classList.toggle('border-slate-200', !active);
        const icon = card.querySelector('i');
        if (icon) { icon.classList.toggle('text-primary', active); icon.classList.toggle('text-slateMuted', !active); }
    });
    // Upload gambar cuma relevan untuk tampilan Modal (butuh ruang cukup
    // luas) -- Banner & Badge tetap teks saja supaya tidak berantakan.
    const imageSection = document.getElementById('nf-image-section');
    if (imageSection) imageSection.classList.toggle('hidden', typeId !== 'modal');
    renderNotifLivePreview();
}

function toggleNotifScheduleFields() {
    const on = document.getElementById('nf-schedule-enabled').checked;
    document.getElementById('nf-schedule-fields').classList.toggle('hidden', !on);
}

function readNotifFormIntoObject() {
    const images = Array.from(document.querySelectorAll('.notif-image-url-input'))
        .map(el => el.value.trim())
        .filter(Boolean);
    return {
        enabled: document.getElementById('nf-enabled').checked,
        type: document.getElementById('nf-type').value,
        title: document.getElementById('nf-title').value.trim(),
        message: document.getElementById('nf-message').value.trim(),
        images: images,
        ctaLabel: document.getElementById('nf-cta-label').value.trim(),
        ctaLink: document.getElementById('nf-cta-link').value.trim(),
        icon: document.getElementById('nf-icon').value,
        frequency: document.getElementById('nf-frequency').value,
        scheduleEnabled: document.getElementById('nf-schedule-enabled').checked,
        startDate: document.getElementById('nf-start-date').value,
        endDate: document.getElementById('nf-end-date').value
    };
}

function saveNotifikasiForm() {
    DB.notification = readNotifFormIntoObject();
    saveDB('Notifikasi situs berhasil disimpan.');
}

// Pratinjau: tampilkan persis seperti yang akan dilihat pengunjung, TANPA
// menyimpan dulu -- dibuka di tab baru situs publik dengan flag khusus
// (?notifPreview=1), data pratinjau dititipkan lewat sessionStorage supaya
// tab baru itu tetap menampilkannya sekali terlepas dari localStorage/
// frekuensi yang sudah tersimpan di perangkat admin.
function previewNotification() {
    const data = readNotifFormIntoObject();
    if (!data.title && !data.message && !data.image) {
        showToast('Isi judul, pesan, atau gambar dulu sebelum pratinjau.', 'error');
        return;
    }
    try {
        sessionStorage.setItem('notifPreviewData', JSON.stringify(data));
    } catch (err) { /* abaikan, halaman publik akan pakai data tersimpan kalau ada */ }
    window.open('/?notifPreview=1', '_blank', 'noopener');
}

// Tandai kunci Gemini untuk dihapus saat form disimpan (input password
// dikosongkan lagi supaya tidak tertukar dengan "biarkan apa adanya").
function clearChatbotGeminiKey() {
    openConfirmModal('API key Gemini yang tersimpan akan dihapus dari server. Chatbot tidak akan bisa menjawab sampai API key baru diisi lagi.', () => {
        const keyInput = document.getElementById('cb-f-gemini-key');
        if (keyInput) keyInput.dataset.clear = '1';
        if (chatbotSettingsCache) chatbotSettingsCache.geminiApiKeySet = false;
        if (keyInput) keyInput.placeholder = 'Tempel API key Gemini di sini';
        showToast('Kunci akan dihapus setelah Anda menekan "Simpan Pengaturan Chatbot".');
    });
}

async function saveChatbotForm() {
    const btn = document.getElementById('cb-save-btn');
    const enabled = document.getElementById('cb-f-enabled').checked;
    const botName = document.getElementById('cb-f-name').value.trim();
    const customInstructions = document.getElementById('cb-f-instructions').value;
    const keyInput = document.getElementById('cb-f-gemini-key');
    const keyValue = keyInput.value.trim();

    let geminiApiKey = ''; // kosong = biarkan kunci lama apa adanya (lihat src/index.js)
    if (keyInput.dataset.clear === '1' && !keyValue) {
        geminiApiKey = '__CLEAR__';
    } else if (keyValue) {
        geminiApiKey = keyValue;
    }

    if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
    try {
        const res = await fetch('/api/admin/chatbot-settings', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled, botName, geminiApiKey, customInstructions }),
        });
        if (res.status === 401) {
            showToast('Sesi berakhir, silakan masuk lagi.', 'error');
            setTimeout(() => window.location.replace('/login.html'), 1000);
            return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            showToast(data.error || 'Gagal menyimpan pengaturan chatbot.', 'error');
            return;
        }
        showToast('Pengaturan chatbot berhasil disimpan.');
        // DB.chatbotPublic dipakai di beranda publik lewat GET /api/data --
        // sinkronkan juga salinan lokal supaya konsisten kalau admin membuka
        // beranda di tab yang sama tanpa reload.
        if (DB.chatbotPublic) {
            DB.chatbotPublic.enabled = enabled;
            DB.chatbotPublic.botName = botName || 'Asisten SekolahKu';
        }
        loadChatbotSettings();
    } catch (err) {
        showToast('Tidak bisa menghubungi server.', 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Simpan Pengaturan Chatbot'; }
    }
}

            </div>
        </div>

            <div>
                <label class="block text-xs font-semibold text-slateDark mb-1">Judul</label>
                <input type="text" id="pn-f-title" maxlength="100" placeholder="mis. Pengumuman Libur Sekolah" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm" required>

                <label class="block text-xs font-semibold text-slateDark mb-1">Isi Pesan</label>
                <textarea id="pn-f-message" rows="3" maxlength="300" placeholder="Tulis isi notifikasi secara singkat dan jelas." class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm" required></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slateDark mb-1">Link Tujuan (opsional)</label>
                <input type="text" id="pn-f-link" placeholder="mis. /berita/nama-artikel atau dikosongkan untuk ke beranda" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm">
                <p class="text-[11px] text-slateMuted mt-1">Halaman yang terbuka saat pengunjung mengklik notifikasinya. Kosongkan untuk mengarah ke beranda.</p>
            </div>
            <button type="submit" id="pn-send-btn" class="px-6 py-2.5 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primaryHover transition-colors shadow-soft" ${status.count === 0 ? 'disabled' : ''}>Kirim ke ${status.count} Pengunjung</button>
        </form>
        <div id="push-notif-result" class="mt-4"></div>
    `;

}

async function sendPushNotifForm() {
    const btn = document.getElementById('pn-send-btn');
    const title = document.getElementById('pn-f-title').value.trim();
    const message = document.getElementById('pn-f-message').value.trim();
    const link = document.getElementById('pn-f-link').value.trim();
    if (!title || !message) {
        showToast('Judul dan isi pesan wajib diisi.', 'error');
        return;
    }
    // Simpan label asli ("Kirim ke N Pengunjung") supaya bisa dikembalikan
    // persis kalau pengiriman GAGAL (validasi/jaringan) -- sebelumnya
    // finally selalu menimpa dengan teks generik "Kirim", jadi label
    // salah/tidak lengkap sampai admin pindah menu lalu balik lagi.
    // Kalau pengiriman SUKSES, loadPushNotifStatus() akan me-render ulang
    // panel dengan label baru yang benar, jadi baris ini tidak berpengaruh.
    const originalLabel = btn ? btn.textContent : 'Kirim';

    openConfirmModal('Notifikasi akan langsung dikirim ke semua pengunjung yang berlangganan sekarang juga. Lanjutkan?', async () => {
        if (btn) { btn.disabled = true; btn.textContent = 'Mengirim...'; }
        try {
            const res = await fetch('/api/admin/push/send', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, message, link }),
            });
            if (res.status === 401) {
                showToast('Sesi berakhir, silakan masuk lagi.', 'error');
                setTimeout(() => window.location.replace('/login.html'), 1000);
                return;
            }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showToast(data.error || 'Gagal mengirim notifikasi push.', 'error');
                return;
            }
            const resultEl = document.getElementById('push-notif-result');
            if (resultEl) {
                resultEl.innerHTML = `<p class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">Terkirim ke ${data.sent} pengunjung. ${data.failed ? data.failed + ' gagal. ' : ''}${data.removed ? data.removed + ' langganan basi otomatis dibersihkan.' : ''}</p>`;
            }
            showToast('Notifikasi push berhasil dikirim.');
            loadPushNotifStatus();
        } catch (err) {
            showToast('Tidak bisa menghubungi server.', 'error');
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
        }
    });
}

function renderPanelKomentar() {
    document.getElementById('admin-panel-content').innerHTML = `

    // masing-masing (untuk konteks -- komentar mana yang cocok punya artikel yang mana).
    const beritaTitleById = {};
    (DB.berita || []).forEach(b => { beritaTitleById[b.id] = b.title; });
    const flat = [];
    Object.keys(DB.beritaComments || {}).forEach(beritaId => {
        (DB.beritaComments[beritaId] || []).forEach(c => {
            flat.push({ ...c, beritaId, articleTitle: beritaTitleById[beritaId] || '(artikel sudah dihapus)' });
        });
    });
    flat.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));

    const listEl = document.getElementById('komentar-list');
    if (!flat.length) {
        listEl.innerHTML = `<p class="text-sm text-slateMuted">Belum ada komentar masuk.</p>`;
        reInitIcons();
        return;
    }

    listEl.innerHTML = flat.map(c => `
        <div class="py-4 border-b border-slate-100 last:border-0">
            <div class="flex items-start gap-3">
                <div class="w-9 h-9 shrink-0 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-sm">${escapeHtml((c.name || '?').trim().charAt(0).toUpperCase())}</div>

                    <div id="reply-view-${c.id}" ${c.reply ? '' : 'style="display:none"'} class="mt-2.5 pl-3 py-2 border-l-2 border-primary bg-primary/5 rounded-r-lg">

function toggleReplyForm(commentId) {
    const formEl = document.getElementById(`reply-form-${commentId}`);
    if (!formEl) return;
    const showing = formEl.style.display !== 'none';
    formEl.style.display = showing ? 'none' : 'block';
    const toggleBtn = document.getElementById(`reply-toggle-${commentId}`);
    if (toggleBtn) toggleBtn.style.display = showing ? '' : 'none';
    if (!showing) {
        const input = document.getElementById(`reply-input-${commentId}`);
        if (input) { input.focus(); }
    }
}

async function submitReplyKomentar(commentId) {
    const input = document.getElementById(`reply-input-${commentId}`);
    if (!input) return;
    const reply = input.value.trim();
    if (!reply) {
        showToast('Tulis balasan terlebih dahulu.', 'error');
        return;
    }
    await sendReplyRequest(commentId, reply);
}

function requestDeleteReply(commentId, name) {
    openConfirmModal(`Hapus balasan untuk komentar dari "${name}"? Balasan tidak akan tampil lagi di publik.`, () => sendReplyRequest(commentId, ''));
}

async function sendReplyRequest(commentId, reply) {
    try {
        const res = await fetch('/api/admin/berita-comments/reply', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: commentId, reply })
        });
        if (res.status === 401) { window.location.replace('/login.html'); return; }
        const result = await res.json().catch(() => ({}));
        if (!res.ok) {
            showToast(result.error || 'Gagal menyimpan balasan.', 'error');
            return;
        }
        // Update cache lokal DB.beritaComments supaya panel langsung
        // ter-update tanpa perlu pullFromCloud ulang.
        Object.keys(DB.beritaComments || {}).forEach(beritaId => {
            (DB.beritaComments[beritaId] || []).forEach(c => {
                if (c.id === commentId) {
                    c.reply = result.reply || '';
                    c.reply_at = result.reply_at || 0;
                }
            });
        });
        showToast(reply ? 'Balasan berhasil dikirim.' : 'Balasan berhasil dihapus.');
        renderPanelKomentar();
    } catch (err) {
        console.error(err);
        showToast('Gagal menghubungi server.', 'error');
    }
}

function requestDeleteKomentar(commentId, name) {
    openConfirmModal(`Hapus komentar dari "${name}" secara permanen?`, () => deleteKomentar(commentId));
}

async function deleteKomentar(commentId) {
    try {
        const res = await fetch('/api/admin/berita-comments/delete', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: commentId })
        });
        if (res.status === 401) { window.location.replace('/login.html'); return; }
        const result = await res.json().catch(() => ({}));
        if (!res.ok) {
            showToast(result.error || 'Gagal menghapus komentar.', 'error');
            return;
        }
        // Buang juga dari cache lokal DB.beritaComments supaya panel langsung
        // ter-update tanpa perlu pullFromCloud ulang.
        Object.keys(DB.beritaComments || {}).forEach(beritaId => {
            DB.beritaComments[beritaId] = (DB.beritaComments[beritaId] || []).filter(c => c.id !== commentId);
        });
        showToast('Komentar berhasil dihapus.');
        renderPanelKomentar();
    } catch (err) {
        console.error(err);
        showToast('Gagal menghubungi server.', 'error');
    }
}

async function loadSecurityLog() {
    const el = document.getElementById('security-log-list');
    if (!el) return;
    el.innerHTML = `<p class="text-xs text-slateMuted">Memuat log...</p>`;
    try {
        const res = await fetch('/api/admin/security-log', { credentials: 'same-origin' });
        if (res.status === 401) {
            window.location.replace('/login.html');
            return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const attempts = data.attempts || [];
        if (!attempts.length) {
            el.innerHTML = `<p class="text-xs text-slateMuted">Belum ada percobaan login tercatat.</p>`;
            return;
        }
        el.innerHTML = `
            <table class="w-full text-xs">
                <thead>
                    <tr class="text-left text-slateMuted border-b border-slate-200">
                        <th class="py-2 pr-4 font-semibold">Waktu</th>
                        <th class="py-2 pr-4 font-semibold">Username</th>
                        <th class="py-2 pr-4 font-semibold">Alamat IP</th>
                        <th class="py-2 pr-4 font-semibold">Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${attempts.map(a => `
                        <tr class="border-b border-slate-100">
                            <td class="py-2 pr-4 whitespace-nowrap text-slateDark">${escapeHtml(new Date(a.created_at).toLocaleString('id-ID'))}</td>
                            <td class="py-2 pr-4 text-slateDark">${escapeHtml(a.username)}</td>
                            <td class="py-2 pr-4 text-slateMuted font-mono">${escapeHtml(a.ip)}</td>
                            <td class="py-2 pr-4">
                                ${a.success
                                    ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-semibold">Berhasil</span>'
                                    : '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-red-50 text-red-700 font-semibold">Gagal</span>'}
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    } catch (err) {
        el.innerHTML = `<p class="text-xs text-red-600">Gagal memuat log keamanan.</p>`;
    }
}

async function addAdminUser() {
    const errorEl = document.getElementById('add-admin-error');
    errorEl.classList.add('hidden-important');
    const username = document.getElementById('f-new-admin-username').value.trim();
    const password = document.getElementById('f-new-admin-password').value;
    try {
        const res = await fetch('/api/admin/users', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (res.status === 401) {
            window.location.replace('/login.html');
            return;
        }
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            errorEl.textContent = body.error || 'Gagal menambah admin.';
            errorEl.classList.remove('hidden-important');
            return;
        }
        document.getElementById('add-admin-form').reset();

        errorEl.classList.remove('hidden-important');

}

function deleteAdminUser(username) {
    openConfirmModal(
        `Hapus akun admin "${username}"? Akun ini akan langsung ter-logout di semua perangkat dan tidak bisa login lagi.`,

                const res = await fetch('/api/admin/users/delete', {
                    method: 'POST',

                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                if (res.status === 401) {
                    window.location.replace('/login.html');
                    return;
                }
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    showToast(body.error || 'Gagal menghapus admin.', 'error');
                    return;
                }
                showToast('Admin berhasil dihapus.');
                loadAdminUsersList();
            } catch (err) {
                showToast('Tidak bisa menghubungi server.', 'error');
            }
        }
    );
}

/* =========================================================================
   BACKUP & RESTORE — ekspor/impor seluruh isi DB sebagai file .json.
   Kredensial admin tidak pernah ikut (memang sudah tidak disimpan di DB
   sejak versi login-server), jadi file backup aman dibagikan/disimpan.
========================================================================= */
function downloadBackup() {
    syncCustomPagesIntoOrder(DB);
    const payload = {
        __backup: 'sdn01papahan',
        __exportedAt: new Date().toISOString(),
        data: DB
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const tanggal = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `backup-sdn01papahan-${tanggal}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup berhasil diunduh.');
}

function handleRestoreFileSelect(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const statusEl = document.getElementById('restore-status');
    const reader = new FileReader();
    reader.onload = () => {
        let parsed;
        try {
            parsed = JSON.parse(reader.result);
        } catch (e) {
            statusEl.textContent = 'File bukan JSON yang valid.';
            statusEl.className = 'text-xs rounded-lg px-3 py-2 bg-red-50 text-red-600 border border-red-100';
            return;
        }
        // Terima dua bentuk: hasil "Unduh Backup" ({ __backup, data }) atau
        // file JSON mentah objek DB itu sendiri.
        const incoming = (parsed && typeof parsed === 'object' && parsed.__backup === 'sdn01papahan' && parsed.data)
            ? parsed.data
            : parsed;
        if (!incoming || typeof incoming !== 'object' || !incoming.meta) {
            statusEl.textContent = 'Isi file tidak dikenali sebagai backup dashboard ini.';
            statusEl.className = 'text-xs rounded-lg px-3 py-2 bg-red-50 text-red-600 border border-red-100';
            statusEl.classList.remove('hidden-important');
            input.value = '';
            return;
        }
        openConfirmModal(
            'Semua data saat ini (berita, galeri, halaman, dll) akan DIGANTI dengan isi file backup ini. Tindakan ini tidak bisa dibatalkan. Lanjutkan?',
            () => restoreFromBackupData(incoming)
        );
        input.value = '';
    };
    reader.onerror = () => {
        statusEl.textContent = 'Gagal membaca file.';
        statusEl.className = 'text-xs rounded-lg px-3 py-2 bg-red-50 text-red-600 border border-red-100';
        statusEl.classList.remove('hidden-important');
    };
    reader.readAsText(file);
}

function restoreFromBackupData(incoming) {
    // Jaring pengaman: field kredensial (kalau ada di file backup lama) tidak
    // pernah ikut dipulihkan.
    if (incoming && typeof incoming === 'object' && 'admin' in incoming) delete incoming.admin;

    DB = migrateDB(Object.assign({}, DEFAULT_DB, incoming));

    const statusEl = document.getElementById('restore-status');
    if (statusEl) {
        statusEl.textContent = 'Data berhasil dipulihkan dan sedang disinkronkan ke server.';
        statusEl.className = 'text-xs rounded-lg px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-100';
        statusEl.classList.remove('hidden-important');
    }
    saveDB('Backup berhasil dipulihkan dan disinkronkan ke server.');
    showAdminPanel(typeof currentPanel !== 'undefined' ? currentPanel : 'overview');
}

async function handleLogoFileSelect(fileInputEl) {
    const file = fileInputEl.files && fileInputEl.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
        showToast('File yang dipilih bukan gambar.', 'error');
        fileInputEl.value = '';
        return;
    }
    try {
        const p = IMAGE_UPLOAD_PRESETS.logo;
        const dataUrl = await resizeImageFile(file, p.maxWidth, p.quality, p.sizeLimit);
        document.getElementById('f-meta-logo-image').value = dataUrl;
        updateMetaLogoPreview();
        showToast('Mengunggah foto logo...');
        const uploadedUrl = await uploadImageToServer(dataUrl);
        document.getElementById('f-meta-logo-image').value = uploadedUrl;
        updateMetaLogoPreview();
        showToast('Foto logo berhasil diunggah — klik "Simpan Logo" untuk menerapkannya.');
    } catch (err) {
        handleImageUploadError(err);
    } finally {
        fileInputEl.value = '';
    }
}

async function savePengaturanForm() {
    const errorEl = document.getElementById('pengaturan-error');
    errorEl.classList.add('hidden-important');
    const currentPassword = document.getElementById('f-set-current-password').value;
    const newPassword = document.getElementById('f-set-password').value;
    try {
        const res = await fetch('/api/admin/change-password', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ currentPassword, newPassword })
        });
        if (res.status === 401) {
            showToast('Sesi berakhir, silakan masuk lagi.', 'error');
            setTimeout(() => window.location.replace('/login.html'), 1000);
            return;
        }
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            errorEl.textContent = body.error || 'Gagal mengubah password.';
            errorEl.classList.remove('hidden-important');
            return;
        }
        document.getElementById('pengaturan-form').reset();
        showToast('Password admin berhasil diperbarui.');
        if (forcePasswordChangeActive) {
            // Password default sudah diganti -> buka kembali semua menu.
            forcePasswordChangeActive = false;
            renderForcePasswordBanner();
            buildAdminNav();
            showAdminPanel('overview');
        }
    } catch (err) {
        errorEl.textContent = 'Tidak bisa menghubungi server.';
        errorEl.classList.remove('hidden-important');
    }
}

function crudTableHtml(sectionKey, subtitle) {
    const cfg = SECTION_CONFIG[sectionKey];
    const items = DB[sectionKey] || [];
    const cols = cfg.columns;
    const imageField = cfg.fields.find(f => f.type === 'image');
    const totalCols = cols.length + (imageField ? 1 : 0) + 1;
    return `
        <div class="inst-card overflow-hidden">
            <div class="flex items-center justify-between p-5 border-b border-borderLight">
                <p class="text-sm text-slateMuted">${subtitle}</p>
                <button onclick="openItemModal('${sectionKey}', null)" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primaryHover transition-colors shadow-soft">
                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah ${cfg.itemLabel}
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm table-fixed">
                    <thead>
                        <tr class="bg-slate-50 text-left text-xs text-slateMuted uppercase tracking-wide">
                            ${imageField ? `<th class="px-5 py-3 font-semibold w-20">Foto</th>` : ''}
                            ${cols.map((c, i) => `<th class="px-5 py-3 font-semibold ${i === 0 ? 'w-auto' : 'w-40'}">${c.label}</th>`).join('')}
                            <th class="px-5 py-3 font-semibold text-right w-28">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-borderLight">
                        ${items.length === 0 ? `<tr><td colspan="${totalCols}" class="px-5 py-8 text-center text-slateMuted">Belum ada data. Klik "Tambah ${cfg.itemLabel}" untuk menambahkan.</td></tr>` : ''}
                        ${items.map((item, idx) => `
                            <tr class="hover:bg-slate-50">
                                ${imageField ? (String(item[imageField.key] || '').trim()
                                    ? `<td class="px-5 py-3"><img src="${escapeHtml(String(item[imageField.key]))}" class="w-10 h-10 rounded-lg object-cover border border-slate-200 bg-slate-50"></td>`
                                    : `<td class="px-5 py-3"><div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slateMuted">${escapeHtml(String(item[cols[0].key] || '?').trim().charAt(0).toUpperCase())}</div></td>`
                                ) : ''}
                                ${cols.map(c => `<td class="px-5 py-3 text-slateDark truncate">${escapeHtml(String(item[c.key] ?? ''))}</td>`).join('')}
                                <td class="px-5 py-3 text-right whitespace-nowrap">
                                    <button onclick="openItemModal('${sectionKey}', ${idx})" class="p-2 text-slateMuted hover:text-primary hover:bg-blue-50 rounded-lg transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                    <button onclick="requestDeleteItem('${sectionKey}', ${idx})" class="p-2 text-slateMuted hover:text-red-600 hover:bg-red-50 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

let itemModalContext = { sectionKey: null, index: null };
// Token bertambah setiap kali modal item dibuka -- dipakai generateBeritaAI()
// untuk mendeteksi kalau admin menutup/berpindah modal SEBELUM balasan AI
// datang, supaya hasil generate yang telat tidak nyasar ditulis ke form
// item/section lain yang sedang terbuka saat itu.
let itemModalToken = 0;

function openItemModal(sectionKey, index) {
    const cfg = SECTION_CONFIG[sectionKey];
    itemModalContext = { sectionKey, index };
    itemModalToken++;
    const isEdit = index !== null;
    const data = isEdit ? DB[sectionKey][index] : {};

    document.getElementById('item-modal-title').textContent = (isEdit ? 'Edit ' : 'Tambah ') + cfg.itemLabel;
    document.getElementById('item-modal-subtitle').textContent = isEdit ? 'Perbarui data lalu simpan.' : 'Lengkapi data baru lalu simpan.';

    document.getElementById('item-modal-fields').innerHTML = cfg.fields.map(f => {
        const val = data[f.key] !== undefined ? data[f.key] : '';
        if (f.type === 'textarea') {
            const textareaHtml = `<div><label class="block text-xs font-semibold text-slateDark mb-1">${f.label}</label>
                <textarea id="mf-${f.key}" rows="${f.rows || 3}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm">${escapeHtml(val)}</textarea></div>`;
            // Tombol "Generate dengan AI" khusus form Berita, ditaruh persis
            // setelah field poin-poin -- klik akan mengisi excerpt/content/tags
            // di bawahnya (lihat generateBeritaAI()). Hasilnya tetap draft,
            // admin wajib cek & boleh edit sebelum menyimpan/posting.
            if (sectionKey === 'berita' && f.key === 'points') {
                return textareaHtml + `
                <div class="-mt-2 mb-1">
                    <button type="button" id="btn-generate-berita-ai" onclick="generateBeritaAI()"
                        class="w-full px-4 py-2.5 rounded-lg border border-primary/30 bg-primary/5 text-primary text-sm font-semibold hover:bg-primary/10 transition flex items-center justify-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4"></i> Generate dengan AI
                    </button>
                    <p class="text-[11px] text-slateMuted mt-1">Isi judul & poin-poin di atas dulu. Hasil AI akan mengisi Cuplikan, Isi Lengkap, dan Tags di bawah — tetap bisa diedit sebelum disimpan.</p>
                </div>`;
            }
            return textareaHtml;
        }
        if (f.type === 'select') {
            return `<div><label class="block text-xs font-semibold text-slateDark mb-1">${f.label}</label>
                <select id="mf-${f.key}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm bg-white">
                    ${f.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}
                </select></div>`;
        }
        if (f.type === 'checkbox') {
            return `<div class="flex items-center gap-2">
                <input type="checkbox" id="mf-${f.key}" ${val ? 'checked' : ''} class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary/30">
                <label for="mf-${f.key}" class="text-sm text-slateDark">${f.label}</label></div>`;
        }
        if (f.type === 'image') {
            return `<div>
                <label class="block text-xs font-semibold text-slateDark mb-1">${f.label}</label>
                <div class="flex items-center gap-3 mb-2">
                    <img id="mf-preview-${f.key}" src="${escapeHtml(val)}" class="w-16 h-16 rounded-lg object-cover border border-slate-200 bg-slate-50">
                    <label class="flex-1 cursor-pointer">
                        <div class="px-3 py-2.5 rounded-lg border border-dashed border-slate-300 text-xs text-slateMuted hover:border-primary hover:text-primary transition text-center">
                            <i data-lucide="upload" class="w-4 h-4 inline mb-0.5"></i> Klik untuk unggah foto dari perangkat
                        </div>
                        <input type="file" accept="image/*" class="hidden" onchange="handleImageFileSelect(this, 'mf-${f.key}', 'mf-preview-${f.key}', '${f.preset || 'banner'}')">
                    </label>
                </div>
                <input type="text" id="mf-${f.key}" value="${escapeHtml(val)}" oninput="normalizeImageUrlInput(this); document.getElementById('mf-preview-${f.key}').src=this.value" placeholder="atau tempel URL gambar / link Google Drive" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-xs text-slateMuted"></div>`;
        }
        return `<div><label class="block text-xs font-semibold text-slateDark mb-1">${f.label}</label>
            <input type="text" id="mf-${f.key}" value="${escapeHtml(val)}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm"></div>`;
    }).join('');

    document.getElementById('item-modal').classList.remove('hidden-important');
    document.getElementById('item-modal').classList.add('flex');
    reInitIcons();
}

async function generateBeritaAI() {
    const btn = document.getElementById('btn-generate-berita-ai');
    const judulEl = document.getElementById('mf-title');
    const poinEl = document.getElementById('mf-points');
    const judul = (judulEl && judulEl.value || '').trim();
    const poin = (poinEl && poinEl.value || '').trim();
    if (!judul || !poin) {
        showToast('Isi Judul Berita dan Poin-poin Inti Berita dulu sebelum generate.', 'error');
        return;
    }

    // Rekam token modal SAAT tombol diklik -- kalau berbeda dari token
    // saat ini pas balasan AI datang, artinya admin sudah menutup/berpindah
    // modal (lihat openItemModal()), jadi hasilnya dibuang, tidak ditulis
    // ke form yang salah.
    const tokenAtClick = itemModalToken;

    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Sedang generate...';
    reInitIcons();

    try {
        const res = await fetch('/api/admin/berita/generate', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tanggal: (document.getElementById('mf-date') || {}).value || '',
                penulis: (document.getElementById('mf-author') || {}).value || '',
                kategori: (document.getElementById('mf-category') || {}).value || '',
                judul,
                poin,
            })
        });
        if (res.status === 401) { window.location.replace('/login.html'); return; }
        const result = await res.json().catch(() => ({}));

        if (itemModalToken !== tokenAtClick) {
            // Modal sudah ditutup/berganti item selagi menunggu AI -- jangan
            // sentuh DOM sama sekali (bisa jadi elemen mf-excerpt dkk sudah
            // milik item/section lain yang sedang dibuka admin sekarang).
            return;
        }

        if (!res.ok) {
            showToast(result.error || 'Gagal generate berita.', 'error');
            return;
        }
        document.getElementById('mf-excerpt').value = result.excerpt || '';
        document.getElementById('mf-content').value = result.content || '';
        document.getElementById('mf-tags').value = result.tags || '';
        showToast('Draft berhasil digenerate. Cek dulu Cuplikan, Isi Lengkap & Tags sebelum disimpan.');
    } catch (err) {
        console.error(err);
        if (itemModalToken === tokenAtClick) {
            showToast('Gagal menghubungi server.', 'error');
        }
    } finally {
        // Hanya kembalikan state tombol kalau modal yang sama masih terbuka --
        // kalau tokennya sudah beda, tombol ini adalah node lama yang sudah
        // lepas dari DOM (innerHTML modal sudah ditulis ulang oleh
        // openItemModal() berikutnya), jadi tidak perlu diapa-apakan.
        if (itemModalToken === tokenAtClick) {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
            reInitIcons();
        }
    }
}

function closeItemModal() {
    document.getElementById('item-modal').classList.add('hidden-important');
    document.getElementById('item-modal').classList.remove('flex');
    itemModalContext = { sectionKey: null, index: null };
}

function saveItemModal() {
    const { sectionKey, index } = itemModalContext;
    const cfg = SECTION_CONFIG[sectionKey];
    // Mulai dari data lama (jika edit) supaya field di luar form (mis: id) tidak hilang.
    const newItem = index !== null ? Object.assign({}, DB[sectionKey][index]) : {};
    cfg.fields.forEach(f => {
        const el = document.getElementById('mf-' + f.key);
        if (f.type === 'checkbox') {
            newItem[f.key] = el.checked;
        } else {
            newItem[f.key] = el.value;
        }
    });
    if (sectionKey === 'berita' && !newItem.id) {
        newItem.id = 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    }

    if (index === null) {
        DB[sectionKey].push(newItem);
    } else {
        DB[sectionKey][index] = newItem;
    }
    saveDB('Data ' + cfg.itemLabel.toLowerCase() + ' berhasil disimpan.');
    closeItemModal();
    renderPanelCrudList(sectionKey, SECTION_CONFIG[sectionKey].title);
    showAdminPanel(sectionKey);
}

let confirmModalAction = null;
function openConfirmModal(message, onConfirm) {
    document.querySelector('#confirm-modal p.text-sm').textContent = message;
    confirmModalAction = onConfirm;
    document.getElementById('confirm-modal').classList.remove('hidden-important');
    document.getElementById('confirm-modal').classList.add('flex');
    document.getElementById('confirm-modal-btn').onclick = () => {
        if (confirmModalAction) confirmModalAction();
        closeConfirmModal();
    };
}
function closeConfirmModal() {
    document.getElementById('confirm-modal').classList.add('hidden-important');
    document.getElementById('confirm-modal').classList.remove('flex');
    confirmModalAction = null;
}

function requestDeleteItem(sectionKey, index) {
    openConfirmModal('Data ini akan dihapus secara permanen dari website.', () => {
        const removed = DB[sectionKey][index];
        if (sectionKey === 'berita' && removed && removed.id && DB.beritaComments) {
            delete DB.beritaComments[removed.id];
        }
        DB[sectionKey].splice(index, 1);
        saveDB('Data berhasil dihapus.');
        showAdminPanel(sectionKey);
    });
}

   INIT (Dashboard Admin) — HARUS lolos verifikasi sesi server dulu
   sebelum menampilkan apa pun. Kalau tidak valid, sudah dialihkan ke
   /login.html oleh verifySessionOrRedirect().
========================================================================= */
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await verifySessionOrRedirect();
    if (!ok) return;

    enterAdminMode();
    reInitIcons();
    pullFromCloud();
});
