<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenaga Pendidik - SDN 01 Papahan</title>
<meta name="description" content="Profil tenaga pendidik dan kependidikan SDN 01 Papahan.">
<link rel="canonical" href="/guru">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
    colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B', surface: '#FFFFFF', borderLight: '#F1F5F9' },
    boxShadow: { soft: '0 4px 20px -2px rgba(0,0,0,0.05)', glass: '0 8px 32px 0 rgba(31,38,135,0.07)' }
} } }
</script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="antialiased overflow-x-hidden selection:bg-primary selection:text-white">
<div id="navbar-root"></div>
<main class="pt-32 pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-12" id="header">
      <div class="skeleton h-6 w-32 mx-auto mb-3"></div>
      <div class="skeleton h-9 w-2/3 mx-auto"></div>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6" id="guru-grid"></div>
  </div>
</main>
<div id="footer-root"></div>

<script src="/assets/js/site.js"></script>
<script>
initPublicPage('pengajar', async (store) => {
  const h = store.guruHeader || {};
  document.getElementById('header').innerHTML = `
    <span class="text-xs font-semibold text-primary">${escHtml(h.eyebrow || '')}</span>
    <h1 class="text-3xl font-bold text-slateDark mt-2">${escHtml(h.titlePrefix || '')} <span class="text-primary">${escHtml(h.titleHighlight || '')}</span></h1>
    <p class="text-slateMuted mt-3">${escHtml(h.subtitle || '')}</p>`;
  const list = (store.guru || []).slice().sort((a,b) => (b.isKepsek?1:0) - (a.isKepsek?1:0));
  document.getElementById('guru-grid').innerHTML = list.map(g => `
    <div class="inst-card p-6 text-center">
      <img src="${escHtml(g.photo || 'https://i.pravatar.cc/150')}" class="w-20 h-20 rounded-full object-cover mx-auto mb-4">
      <h3 class="font-bold text-slateDark">${escHtml(g.name)}</h3>
      <p class="text-xs text-primary font-medium mb-1">${escHtml(g.role)}${g.isKepsek ? ' &bull; Kepala Sekolah' : ''}</p>
      <p class="text-xs text-slateMuted">${escHtml(g.education || '')}</p>
      <p class="text-xs text-slateMuted">${escHtml(g.experience || '')}</p>
    </div>`).join('') || '<p class="text-slateMuted col-span-4 text-center">Belum ada data.</p>';
});
</script>
</body>
</html>
