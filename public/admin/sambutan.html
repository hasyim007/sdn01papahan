<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sambutan — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="sambutan">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  const fields = [
    { key: 'badge', label: 'Badge' },
    { key: 'titlePrefix', label: 'Judul (bagian awal)' },
    { key: 'titleHighlight', label: 'Judul (bagian disorot)' },
    { key: 'paragraphs', label: 'Paragraf Sambutan', type: 'array-text' },
    { key: 'name', label: 'Nama Kepala Sekolah' },
    { key: 'role', label: 'Jabatan' },
    { key: 'photo', label: 'Foto', type: 'image' }
  ];
  renderObjectEditor(main, 'sambutan', fields, 'Sambutan Kepala Sekolah', '');
};
</script>
</body>
</html>
