<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow p-8">
    <h1 class="text-xl font-bold text-slateDark mb-1">Login Admin</h1>
    <p class="text-sm text-slateMuted mb-6">SDN 01 Papahan — Panel Admin</p>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slateDark mb-1">Username</label>
        <input type="text" id="username" class="w-full px-4 py-2.5 rounded-lg border border-slate-200" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slateDark mb-1">Password</label>
        <input type="password" id="password" class="w-full px-4 py-2.5 rounded-lg border border-slate-200" required>
      </div>
      <p id="login-error" class="text-sm text-red-600 hidden"></p>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-primary text-white font-semibold hover:bg-primaryHover">Masuk</button>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      errEl.classList.add('hidden');
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        window.location.href = '/admin/dashboard.html';
      } else {
        const data = await res.json().catch(() => ({}));
        errEl.textContent = data.error || 'Login gagal.';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
