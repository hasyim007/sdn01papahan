<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestasi & Ekskul — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="prestasi">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  const prestasiFields = [
    { key: 'title', label: 'Judul Prestasi' },
    { key: 'studentName', label: 'Nama Siswa' },
    { key: 'badge', label: 'Badge (mis. PENCAPAIAN)' },
    { key: 'date', label: 'Tanggal' },
    { key: 'photo', label: 'Foto', type: 'image' }
  ];
  const prestasiHeaderFields = [
    { key: 'eyebrow', label: 'Eyebrow' },
    { key: 'titlePrefix', label: 'Judul (awal)' },
    { key: 'titleHighlight', label: 'Judul (disorot)' },
    { key: 'subtitle', label: 'Subjudul', type: 'textarea' }
  ];
  renderListEditor(main, 'prestasi', prestasiFields, 'Prestasi Siswa', 'Capaian/penghargaan yang diraih siswa.',
    { headerFields: prestasiHeaderFields, headerKey: 'prestasiHeader' });

  const ekWrap = document.createElement('div');
  ekWrap.className = 'mt-16 pt-10 border-t border-slate-200';
  main.appendChild(ekWrap);
  const ekFields = [
    { key: 'name', label: 'Nama Ekskul' },
    { key: 'status', label: 'Status (mis. Wajib/Pilihan)' },
    { key: 'icon', label: 'Ikon (nama Lucide)' },
    { key: 'color', label: 'Warna' }
  ];
  const ekHeaderFields = [
    { key: 'title', label: 'Judul Bagian' },
    { key: 'subtitle', label: 'Subjudul' }
  ];
  renderListEditor(ekWrap, 'ekskul', ekFields, 'Ekstrakurikuler', 'Daftar ekstrakurikuler sekolah.',
    { headerFields: ekHeaderFields, headerKey: 'ekskulHeader' });
};
</script>
</body>
</html>
