<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Unggulan — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="program">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  const fields = [
    { key: 'title', label: 'Judul' },
    { key: 'desc', label: 'Deskripsi', type: 'textarea' },
    { key: 'icon', label: 'Ikon (nama Lucide, mis. book-open)' },
    { key: 'color', label: 'Warna (primary/indigo/emerald/amber)' }
  ];
  const headerFields = [
    { key: 'eyebrow', label: 'Eyebrow' },
    { key: 'title', label: 'Judul Bagian' },
    { key: 'subtitle', label: 'Subjudul', type: 'textarea' }
  ];
  renderListEditor(main, 'program', fields, 'Program Unggulan', 'Daftar program unggulan sekolah.',
    { headerFields, headerKey: 'programHeader' });
};
</script>
</body>
</html>
