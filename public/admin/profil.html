<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Sekolah - Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: { fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}, colors: { primary:'#2563EB', primaryHover:'#1D4ED8', slateDark:'#0F172A', slateMuted:'#64748B' } } } }</script>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="antialiased">
<div class="flex">
  <div id="admin-sidebar-root"></div>
  <main class="flex-1 p-8 max-w-2xl">
    <h1 class="text-2xl font-bold text-slateDark mb-1">Profil Sekolah</h1>
    <p class="text-sm text-slateMuted mb-8">Halaman publik: <code>/profil</code></p>
    <div class="admin-card p-6">
      <div id="form"></div>
      <button id="save" class="btn-primary">Simpan</button>
    </div>
  </main>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  await initAdminPage('profil');
  const form = document.getElementById('form');
  try {
    const data = (await api('/api/store/profil')).data || {};
    buildSimpleForm(form, [
      { key: 'eyebrow', label: 'Eyebrow', type: 'text' },
      { key: 'title', label: 'Judul', type: 'text' },
      { key: 'desc', label: 'Deskripsi Singkat', type: 'textarea' },
      { key: 'visi', label: 'Visi', type: 'textarea' },
      { key: 'misi', label: 'Misi (satu baris = satu poin)', type: 'array-text' },
      { key: 'fasilitas', label: 'Deskripsi Fasilitas', type: 'textarea' },
    ], data);
    document.getElementById('save').addEventListener('click', async () => {
      try { await api('/api/store/profil', { method: 'PUT', body: JSON.stringify({ data: readSimpleForm(form) }) }); toast('Tersimpan'); }
      catch (e) { toast(e.message, 'error'); }
    });
  } catch (e) { toast(e.message, 'error'); }
})();
</script>
</body>
</html>
