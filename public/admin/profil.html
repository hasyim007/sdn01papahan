<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Sekolah — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="profil">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  const fields = [
    { key: 'eyebrow', label: 'Eyebrow' },
    { key: 'title', label: 'Judul' },
    { key: 'desc', label: 'Deskripsi', type: 'textarea' },
    { key: 'visi', label: 'Visi', type: 'textarea' },
    { key: 'misi', label: 'Misi', type: 'array-text' },
    { key: 'fasilitas', label: 'Fasilitas', type: 'textarea' }
  ];
  renderObjectEditor(main, 'profil', fields, 'Profil Sekolah', '');

  const metaWrap = document.createElement('div');
  metaWrap.className = 'mt-12';
  main.appendChild(metaWrap);
  const metaFields = [
    { key: 'schoolName', label: 'Nama Sekolah' },
    { key: 'schoolLocation', label: 'Lokasi (mis. Kabupaten Karanganyar)' },
    { key: 'logoText', label: 'Teks Logo (mis. S1)' },
    { key: 'logoImage', label: 'URL Gambar Logo (opsional)' },
    { key: 'pageTitle', label: 'Judul Tab Browser' },
    { key: 'navCtaText', label: 'Teks Tombol Navbar' }
  ];
  renderObjectEditor(metaWrap, 'meta', metaFields, 'Identitas Situs (Meta)', 'Nama sekolah, logo, dan judul halaman.');
};
</script>
</body>
</html>
