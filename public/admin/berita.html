<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="berita">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  main.innerHTML = pageHeader('Berita', 'Kelola artikel berita: judul, slug, SEO, draft & jadwal tayang.') + `
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-semibold text-slateDark">Daftar Artikel</h2>
      <button id="add-berita-btn" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-semibold">+ Tulis Berita</button>
    </div>
    <div id="berita-table" class="space-y-3"></div>
    <div id="berita-modal" class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4 z-50 overflow-y-auto">
      <div class="bg-white rounded-2xl p-6 max-w-2xl w-full my-8">
        <h3 class="font-bold text-slateDark mb-4" id="bm-title">Artikel</h3>
        <div class="space-y-4" id="bm-fields"></div>
        <div class="flex gap-3 mt-6">
          <button id="bm-save" class="flex-1 px-4 py-2.5 bg-primary text-white rounded-lg font-semibold">Simpan</button>
          <button id="bm-cancel" class="px-4 py-2.5 border border-slate-200 rounded-lg">Batal</button>
        </div>
      </div>
    </div>`;

  let editing = null; // null = baru, atau objek berita

  async function load() {
    const items = await (await fetch('/api/admin/berita')).json();
    document.getElementById('berita-table').innerHTML = items.map(b => `
      <div class="bg-white rounded-xl border border-slate-100 p-4 flex justify-between items-center gap-3">
        <div class="min-w-0">
          <p class="font-semibold text-slateDark text-sm truncate">${esc(b.title)}</p>
          <p class="text-xs text-slateMuted">/${esc(b.slug)} · ${esc(b.category)} ·
            <span class="${b.status === 'published' ? 'text-green-600' : 'text-amber-600'} font-semibold">${b.status === 'published' ? 'Terbit' : 'Draft'}</span>
            · Tayang: ${esc(b.date)}</p>
        </div>
        <div class="flex gap-2 flex-shrink-0">
          <button class="edit-b text-primary text-xs font-semibold" data-id="${b.id}">Edit</button>
          <button class="del-b text-red-600 text-xs font-semibold" data-id="${b.id}">Hapus</button>
        </div>
      </div>`).join('') || '<p class="text-sm text-slateMuted">Belum ada berita.</p>';

    window._beritaItems = items;
    document.querySelectorAll('.edit-b').forEach(b => b.addEventListener('click', () => openModal(items.find(i => i.id === b.dataset.id))));
    document.querySelectorAll('.del-b').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Hapus artikel ini secara permanen?')) return;
      await fetch('/api/admin/berita/' + b.dataset.id, { method: 'DELETE' });
      toast('Artikel dihapus.'); load();
    }));
  }

  function toLocalDatetimeValue(iso) {
    try { return new Date(iso).toISOString().slice(0, 16); } catch { return ''; }
  }

  function openModal(item) {
    editing = item || null;
    document.getElementById('bm-title').textContent = item ? 'Edit Artikel' : 'Tulis Berita Baru';
    const d = item || { status: 'published', publishAt: new Date().toISOString(), author: 'Admin' };
    document.getElementById('bm-fields').innerHTML = `
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Judul</label>
        <input type="text" data-bf="title" value="${esc(d.title || '')}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Slug (URL, kosongkan untuk otomatis dari judul)</label>
        <input type="text" data-bf="slug" value="${esc(d.slug || '')}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-xs font-semibold text-slateDark mb-1">Kategori</label>
          <input type="text" data-bf="category" value="${esc(d.category || '')}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
        <div><label class="block text-xs font-semibold text-slateDark mb-1">Penulis</label>
          <input type="text" data-bf="author" value="${esc(d.author || 'Admin')}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      </div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Tag (pisahkan dengan koma)</label>
        <input type="text" data-bf="tags" value="${esc(d.tags || '')}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Ringkasan (excerpt)</label>
        <textarea data-bf="excerpt" rows="2" class="w-full px-4 py-2.5 rounded-lg border border-slate-200">${esc(d.excerpt || '')}</textarea></div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Konten Lengkap (satu baris kosong = paragraf baru)</label>
        <textarea data-bf="content" rows="8" class="w-full px-4 py-2.5 rounded-lg border border-slate-200">${esc(d.content || '')}</textarea></div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Meta Description (SEO, ±155 karakter)</label>
        <textarea data-bf="metaDescription" rows="2" class="w-full px-4 py-2.5 rounded-lg border border-slate-200">${esc(d.metaDescription || '')}</textarea></div>
      <div>
        <label class="block text-xs font-semibold text-slateDark mb-1">Gambar Sampul (juga dipakai untuk Open Graph)</label>
        <div class="flex items-center gap-3 mb-2">
          <img data-preview="coverImage" src="${esc(d.coverImage || '')}" class="w-20 h-14 rounded-lg object-cover bg-slate-100 border border-slate-200">
          <label class="flex-1 cursor-pointer">
            <div class="px-3 py-2.5 rounded-lg border border-dashed border-slate-300 text-xs text-slateMuted text-center hover:border-primary hover:text-primary">Klik untuk unggah (otomatis dikompres)</div>
            <input type="file" accept="image/*" class="hidden" data-image-input="coverImage">
          </label>
        </div>
        <input type="text" data-bf="coverImage" value="${esc(d.coverImage || '')}" placeholder="atau tempel URL gambar"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-xs text-slateMuted">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-xs font-semibold text-slateDark mb-1">Status</label>
          <select data-bf="status" class="w-full px-4 py-2.5 rounded-lg border border-slate-200">
            <option value="published" ${d.status !== 'draft' ? 'selected' : ''}>Terbit</option>
            <option value="draft" ${d.status === 'draft' ? 'selected' : ''}>Draft</option>
          </select></div>
        <div><label class="block text-xs font-semibold text-slateDark mb-1">Jadwal Tayang</label>
          <input type="datetime-local" data-bf="publishAt" value="${toLocalDatetimeValue(d.publishAt)}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      </div>`;

    document.querySelectorAll('[data-image-input]').forEach(input => {
      input.addEventListener('change', async () => {
        const file = input.files[0]; if (!file) return;
        const dataUrl = await resizeImageFile(file, 1000, 0.72);
        document.querySelector('[data-bf="coverImage"]').value = dataUrl;
        document.querySelector('[data-preview="coverImage"]').src = dataUrl;
      });
    });

    document.getElementById('berita-modal').classList.remove('hidden');
    document.getElementById('berita-modal').classList.add('flex');
  }
  function closeModal() {
    document.getElementById('berita-modal').classList.add('hidden');
    document.getElementById('berita-modal').classList.remove('flex');
  }

  document.getElementById('add-berita-btn').addEventListener('click', () => openModal(null));
  document.getElementById('bm-cancel').addEventListener('click', closeModal);
  document.getElementById('bm-save').addEventListener('click', async () => {
    const payload = {};
    document.querySelectorAll('[data-bf]').forEach(el => { payload[el.dataset.bf] = el.value; });
    if (payload.publishAt) payload.publishAt = new Date(payload.publishAt).toISOString();
    const method = editing ? 'PUT' : 'POST';
    const url = editing ? '/api/admin/berita/' + editing.id : '/api/admin/berita';
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (res.ok) { toast('Artikel disimpan.'); closeModal(); load(); } else { toast('Gagal menyimpan artikel.'); }
  });

  load();
};
</script>
</body>
</html>
