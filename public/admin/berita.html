<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita - Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: { fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}, colors: { primary:'#2563EB', primaryHover:'#1D4ED8', slateDark:'#0F172A', slateMuted:'#64748B' } } } }</script>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="antialiased">
<div class="flex">
  <div id="admin-sidebar-root"></div>
  <main class="flex-1 p-8 max-w-4xl">
    <div class="flex justify-between items-center mb-1">
      <h1 class="text-2xl font-bold text-slateDark">Berita & Artikel</h1>
      <button id="new-btn" class="btn-primary flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Tulis Baru</button>
    </div>
    <p class="text-sm text-slateMuted mb-8">Artikel <b>published</b> tayang di <code>/berita</code>. Set jadwal untuk tayang otomatis nanti.</p>

    <div id="list-view" class="space-y-3"></div>

    <div id="editor-view" class="hidden admin-card p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-bold text-slateDark" id="editor-title">Artikel Baru</h2>
        <button id="editor-close" class="btn-secondary">Kembali ke Daftar</button>
      </div>
      <div id="editor-form"></div>
      <div class="mb-4">
        <label class="field-label">Status</label>
        <select class="field-input" id="f-status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="field-label">Jadwal Tayang (opsional — kosongkan untuk tayang segera saat Published)</label>
        <input type="datetime-local" class="field-input" id="f-publishAt">
      </div>
      <div class="flex gap-3 mb-8">
        <button id="editor-save" class="btn-primary">Simpan Artikel</button>
        <button id="editor-delete" class="btn-danger hidden">Hapus Artikel</button>
      </div>

      <div id="comments-section" class="hidden border-t border-slate-100 pt-6">
        <h3 class="font-bold text-slateDark mb-4">Komentar</h3>
        <div id="comments-list" class="space-y-2"></div>
      </div>
    </div>
  </main>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
let currentId = null;

function slugify(text) {
  return (text || '').toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
}

async function loadList() {
  const { items } = await api('/api/berita');
  const host = document.getElementById('list-view');
  host.innerHTML = items.map((a) => `
    <div class="admin-card p-4 flex items-center justify-between gap-4 cursor-pointer" data-open="${a.id}">
      <div class="flex items-center gap-3 min-w-0">
        <img src="${escHtml(a.coverImage || '')}" class="item-thumb flex-shrink-0">
        <div class="min-w-0">
          <p class="font-semibold text-sm text-slateDark truncate">${escHtml(a.title)}</p>
          <p class="text-xs text-slateMuted truncate">/berita/${escHtml(a.slug)} &bull; ${escHtml(a.category || '')}</p>
        </div>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0 ${a.status === 'published' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">${a.status === 'published' ? 'Published' : 'Draft'}</span>
    </div>`).join('') || '<p class="text-sm text-slateMuted text-center py-10">Belum ada artikel. Klik "Tulis Baru".</p>';
  host.querySelectorAll('[data-open]').forEach((el) => el.addEventListener('click', () => openEditor(el.dataset.open)));
  if (window.lucide) lucide.createIcons();
}

function fieldsDef() {
  return [
    { key: 'title', label: 'Judul Artikel', type: 'text' },
    { key: 'slug', label: 'Slug URL (otomatis dari judul, bisa diubah)', type: 'text' },
    { key: 'category', label: 'Kategori', type: 'text' },
    { key: 'tags', label: 'Tag (pisahkan dengan koma)', type: 'text' },
    { key: 'author', label: 'Penulis', type: 'text' },
    { key: 'dateDisplay', label: 'Tanggal Tampilan (mis. "6 September 2026")', type: 'text' },
    { key: 'coverImage', label: 'Gambar Sampul', type: 'image' },
    { key: 'excerpt', label: 'Ringkasan (excerpt)', type: 'textarea' },
    { key: 'content', label: 'Konten Lengkap (pisahkan paragraf dengan baris kosong)', type: 'textarea' },
    { key: 'metaDescription', label: 'Meta Description (SEO, ideal 150-160 karakter)', type: 'textarea' },
  ];
}

async function openEditor(id) {
  currentId = id || null;
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('editor-view').classList.remove('hidden');
  document.getElementById('editor-title').textContent = id ? 'Edit Artikel' : 'Artikel Baru';
  document.getElementById('editor-delete').classList.toggle('hidden', !id);
  document.getElementById('comments-section').classList.toggle('hidden', !id);

  let art = {};
  if (id) {
    const res = await api(`/api/berita/${id}`);
    art = res.item;
  }
  const form = document.getElementById('editor-form');
  buildSimpleForm(form, fieldsDef(), art);
  document.getElementById('f-status').value = art.status || 'draft';
  document.getElementById('f-publishAt').value = art.publishAt ? art.publishAt.slice(0, 16) : '';

  const titleInput = form.querySelector('[data-field="title"]');
  const slugInput = form.querySelector('[data-field="slug"]');
  if (!id) titleInput.addEventListener('input', () => { slugInput.value = slugify(titleInput.value); });

  if (id) {
    const { items: comments } = await api(`/api/comments/${id}`);
    document.getElementById('comments-list').innerHTML = comments.map((c) => `
      <div class="flex justify-between items-start gap-3 border-b border-slate-50 pb-2">
        <div><p class="text-sm font-medium text-slateDark">${escHtml(c.name || 'Anonim')}</p><p class="text-xs text-slateMuted">${escHtml(c.message)}</p></div>
        <button class="btn-danger flex-shrink-0" data-del-comment="${c.id}">Hapus</button>
      </div>`).join('') || '<p class="text-sm text-slateMuted">Belum ada komentar.</p>';
    document.getElementById('comments-list').querySelectorAll('[data-del-comment]').forEach((el) => el.addEventListener('click', async () => {
      await api(`/api/comments/${el.dataset.delComment}`, { method: 'DELETE' });
      openEditor(id);
    }));
  }
}

function closeEditor() {
  document.getElementById('editor-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  loadList();
}

(async () => {
  await initAdminPage('berita');
  await loadList();

  document.getElementById('new-btn').addEventListener('click', () => openEditor(null));
  document.getElementById('editor-close').addEventListener('click', closeEditor);

  document.getElementById('editor-save').addEventListener('click', async () => {
    const form = document.getElementById('editor-form');
    const data = readSimpleForm(form);
    data.id = currentId || undefined;
    data.status = document.getElementById('f-status').value;
    const publishAtVal = document.getElementById('f-publishAt').value;
    data.publishAt = publishAtVal ? new Date(publishAtVal).toISOString() : null;
    if (!data.slug) data.slug = slugify(data.title);
    try {
      await api('/api/berita', { method: 'POST', body: JSON.stringify(data) });
      toast('Artikel tersimpan');
      closeEditor();
    } catch (e) { toast(e.message, 'error'); }
  });

  document.getElementById('editor-delete').addEventListener('click', async () => {
    if (!currentId || !confirm('Hapus artikel ini? Tindakan tidak bisa dibatalkan.')) return;
    try { await api(`/api/berita/${currentId}`, { method: 'DELETE' }); toast('Artikel dihapus'); closeEditor(); }
    catch (e) { toast(e.message, 'error'); }
  });
})();
</script>
</body>
</html>
