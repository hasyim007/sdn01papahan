<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urutan Halaman — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="page-order">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = async function(main) {
  main.innerHTML = pageHeader('Urutan & Status Halaman', 'Atur urutan menu navigasi dan aktifkan/nonaktifkan halaman. "Beranda" selalu di posisi pertama dan selalu aktif.') + `
    <div id="po-list" class="space-y-2 max-w-2xl"></div>
    <button id="po-save" class="mt-6 px-6 py-2.5 bg-primary text-white rounded-lg font-semibold">Simpan Urutan</button>`;

  let order = (await (await fetch('/api/admin/store/pageOrder')).json()) || [];
  const customSections = await (await fetch('/api/admin/custom-sections')).json();

  // Sinkronkan halaman kustom ke pageOrder TANPA mereset urutan yang sudah ada
  // (bug versi lama: entri kustom terdorong ulang ke urutan default tiap reload).
  // Hanya tambahkan entri yang belum ada, dan buang entri custom yang sudah
  // dihapus dari daftar halaman kustom — entri lain tetap di posisi semula.
  const customKeys = customSections.map(c => 'custom:' + c.slug);
  order = order.filter(p => !String(p.key).startsWith('custom:') || customKeys.includes(p.key));
  customSections.forEach(c => {
    const key = 'custom:' + c.slug;
    if (!order.find(p => p.key === key)) {
      order.push({ key, label: c.menuLabel || c.title, icon: 'layout-template', locked: false, active: c.active });
    }
  });

  function render() {
    document.getElementById('po-list').innerHTML = order.map((p, i) => `
      <div class="bg-white rounded-xl border border-slate-100 p-3 flex items-center gap-3">
        <div class="flex flex-col">
          <button class="up-btn text-slateMuted hover:text-primary disabled:opacity-30" data-i="${i}" ${p.locked || i <= 1 ? 'disabled' : ''}><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
          <button class="down-btn text-slateMuted hover:text-primary disabled:opacity-30" data-i="${i}" ${p.locked || i === order.length - 1 ? 'disabled' : ''}><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
        </div>
        <i data-lucide="${p.icon || 'file'}" class="w-4 h-4 text-slateMuted"></i>
        <span class="flex-1 text-sm font-medium text-slateDark">${esc(p.label)}${p.locked ? ' <span class=\\'text-xs text-slateMuted\\'>(terkunci)</span>' : ''}</span>
        <label class="flex items-center gap-2 text-xs text-slateMuted">
          <input type="checkbox" class="active-cb" data-i="${i}" ${p.active ? 'checked' : ''} ${p.locked ? 'disabled' : ''}> Aktif
        </label>
      </div>`).join('');
    window.lucide?.createIcons();

    document.querySelectorAll('.up-btn').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      if (i <= 1) return;
      [order[i - 1], order[i]] = [order[i], order[i - 1]];
      render();
    }));
    document.querySelectorAll('.down-btn').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      if (i >= order.length - 1) return;
      [order[i + 1], order[i]] = [order[i], order[i + 1]];
      render();
    }));
    document.querySelectorAll('.active-cb').forEach(cb => cb.addEventListener('change', () => {
      order[Number(cb.dataset.i)].active = cb.checked;
    }));
  }
  render();

  document.getElementById('po-save').addEventListener('click', async () => {
    await fetch('/api/admin/store/pageOrder', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order) });
    toast('Urutan halaman disimpan.');
  });
};
</script>
</body>
</html>
