<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="hero">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  const fields = [
    { key: 'badge', label: 'Badge (mis. info PSB)' },
    { key: 'headlinePrefix', label: 'Judul (bagian awal)' },
    { key: 'headlineHighlight', label: 'Judul (bagian disorot)' },
    { key: 'subtitle', label: 'Subjudul', type: 'textarea' },
    { key: 'ctaPrimary', label: 'Teks Tombol Utama' },
    { key: 'ctaSecondary', label: 'Teks Tombol Kedua' },
    { key: 'images', label: 'URL Gambar Carousel', type: 'array-text' },
    { key: 'badge1Title', label: 'Badge Akreditasi — Judul' },
    { key: 'badge1Subtitle', label: 'Badge Akreditasi — Subjudul' },
    { key: 'badge2Value', label: 'Badge Statistik — Nilai (mis. 98%)' },
    { key: 'badge2Label', label: 'Badge Statistik — Label' },
    { key: 'stats.0.value', label: 'Statistik 1 — Nilai (mis. 24+)' },
    { key: 'stats.0.label', label: 'Statistik 1 — Label (mis. Tenaga Pendidik)' },
    { key: 'stats.1.value', label: 'Statistik 2 — Nilai' },
    { key: 'stats.1.label', label: 'Statistik 2 — Label' },
    { key: 'stats.2.value', label: 'Statistik 3 — Nilai' },
    { key: 'stats.2.label', label: 'Statistik 3 — Label' }
  ];
  renderObjectEditor(main, 'hero', fields, 'Hero & Statistik', 'Konten utama di bagian atas landing page.');
};
</script>
</body>
</html>
