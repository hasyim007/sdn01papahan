<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontak & Footer — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="kontak-footer">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  const kontakFields = [
    { key: 'address', label: 'Alamat', type: 'textarea' },
    { key: 'phone', label: 'Telepon' },
    { key: 'email', label: 'Email' }
  ];
  renderObjectEditor(main, 'kontak', kontakFields, 'Kontak', '');

  const footerWrap = document.createElement('div');
  footerWrap.className = 'mt-12';
  main.appendChild(footerWrap);
  const footerFields = [
    { key: 'desc', label: 'Deskripsi Singkat Footer', type: 'textarea' },
    { key: 'copyright', label: 'Teks Copyright' },
    { key: 'socialFacebook', label: 'Link Facebook' },
    { key: 'socialInstagram', label: 'Link Instagram' },
    { key: 'socialYoutube', label: 'Link YouTube' }
  ];
  renderObjectEditor(footerWrap, 'footer', footerFields, 'Footer', '');
};
</script>
</body>
</html>
