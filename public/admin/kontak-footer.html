<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontak & Footer - Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: { fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}, colors: { primary:'#2563EB', primaryHover:'#1D4ED8', slateDark:'#0F172A', slateMuted:'#64748B' } } } }</script>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="antialiased">
<div class="flex">
  <div id="admin-sidebar-root"></div>
  <main class="flex-1 p-8 max-w-2xl">
    <h1 class="text-2xl font-bold text-slateDark mb-1">Kontak & Footer</h1>
    <p class="text-sm text-slateMuted mb-8">Info kontak &amp; isi footer di semua halaman.</p>

    <div class="admin-card p-6 mb-6">
      <h2 class="font-bold text-slateDark mb-4">Informasi Kontak</h2>
      <div id="kontak-form"></div>
      <button id="kontak-save" class="btn-primary">Simpan Kontak</button>
    </div>

    <div class="admin-card p-6">
      <h2 class="font-bold text-slateDark mb-4">Footer</h2>
      <div id="footer-form"></div>
      <button id="footer-save" class="btn-primary">Simpan Footer</button>
    </div>
  </main>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  await initAdminPage('kontak-footer');
  try {
    const kf = document.getElementById('kontak-form');
    const kd = (await api('/api/store/kontak')).data || {};
    buildSimpleForm(kf, [
      { key: 'address', label: 'Alamat', type: 'textarea' },
      { key: 'phone', label: 'Telepon', type: 'text' },
      { key: 'email', label: 'Email', type: 'text' },
    ], kd);
    document.getElementById('kontak-save').addEventListener('click', async () => {
      try { await api('/api/store/kontak', { method: 'PUT', body: JSON.stringify({ data: readSimpleForm(kf) }) }); toast('Tersimpan'); }
      catch (e) { toast(e.message, 'error'); }
    });

    const ff = document.getElementById('footer-form');
    const fd = (await api('/api/store/footer')).data || {};
    buildSimpleForm(ff, [
      { key: 'desc', label: 'Deskripsi Singkat Sekolah', type: 'textarea' },
      { key: 'copyright', label: 'Teks Copyright', type: 'text' },
      { key: 'socialFacebook', label: 'Link Facebook', type: 'text' },
      { key: 'socialInstagram', label: 'Link Instagram', type: 'text' },
      { key: 'socialYoutube', label: 'Link YouTube', type: 'text' },
    ], fd);
    document.getElementById('footer-save').addEventListener('click', async () => {
      try { await api('/api/store/footer', { method: 'PUT', body: JSON.stringify({ data: readSimpleForm(ff) }) }); toast('Tersimpan'); }
      catch (e) { toast(e.message, 'error'); }
    });
  } catch (e) { toast(e.message, 'error'); }
})();
</script>
</body>
</html>
