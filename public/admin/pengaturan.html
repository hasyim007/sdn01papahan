<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Akun - Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: { fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}, colors: { primary:'#2563EB', primaryHover:'#1D4ED8', slateDark:'#0F172A', slateMuted:'#64748B' } } } }</script>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="antialiased">
<div class="flex">
  <div id="admin-sidebar-root"></div>
  <main class="flex-1 p-8 max-w-md">
    <h1 class="text-2xl font-bold text-slateDark mb-1">Pengaturan Akun</h1>
    <p class="text-sm text-slateMuted mb-8">Ganti username dan/atau password admin. Password disimpan ter-hash di database.</p>
    <div class="admin-card p-6">
      <form id="cred-form" class="space-y-4">
        <div><label class="field-label">Password Saat Ini <span class="text-red-500">*</span></label><input type="password" name="currentPassword" required class="field-input"></div>
        <div><label class="field-label">Username Baru <span class="text-slateMuted font-normal">(kosongkan jika tidak diubah)</span></label><input type="text" name="newUsername" class="field-input"></div>
        <div><label class="field-label">Password Baru <span class="text-slateMuted font-normal">(kosongkan jika tidak diubah)</span></label><input type="password" name="newPassword" class="field-input"></div>
        <button type="submit" class="btn-primary">Simpan Perubahan</button>
      </form>
    </div>
  </main>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  await initAdminPage('pengaturan');
  document.getElementById('cred-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const res = await api('/api/admin/credentials', {
        method: 'POST',
        body: JSON.stringify({
          currentPassword: fd.get('currentPassword'),
          newUsername: fd.get('newUsername') || undefined,
          newPassword: fd.get('newPassword') || undefined,
        }),
      });
      toast('Akun diperbarui (username: ' + res.username + ')');
      e.target.reset();
    } catch (err) { toast(err.message, 'error'); }
  });
})();
</script>
</body>
</html>
