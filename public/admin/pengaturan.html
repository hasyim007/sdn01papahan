<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Akun — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="pengaturan">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = function(main) {
  main.innerHTML = pageHeader('Pengaturan Akun', 'Ganti username atau password admin. Password baru langsung di-hash di server.') + `
    <div class="bg-white rounded-2xl border border-slate-100 p-6 max-w-md space-y-4">
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Username Baru (kosongkan jika tidak ganti)</label>
        <input type="text" id="acc-username" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Password Baru (kosongkan jika tidak ganti)</label>
        <input type="password" id="acc-password" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      <div><label class="block text-xs font-semibold text-slateDark mb-1">Password Saat Ini (wajib, untuk verifikasi)</label>
        <input type="password" id="acc-current" class="w-full px-4 py-2.5 rounded-lg border border-slate-200"></div>
      <p id="acc-msg" class="text-sm hidden"></p>
      <button id="acc-save" class="px-6 py-2.5 bg-primary text-white rounded-lg font-semibold">Simpan</button>
    </div>`;

  document.getElementById('acc-save').addEventListener('click', async () => {
    const username = document.getElementById('acc-username').value || undefined;
    const password = document.getElementById('acc-password').value || undefined;
    const currentPassword = document.getElementById('acc-current').value;
    const msg = document.getElementById('acc-msg');
    const res = await fetch('/api/admin/account', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, currentPassword })
    });
    const data = await res.json().catch(() => ({}));
    msg.classList.remove('hidden');
    if (res.ok) { msg.className = 'text-sm text-green-600'; msg.textContent = 'Akun berhasil diperbarui.'; }
    else { msg.className = 'text-sm text-red-600'; msg.textContent = data.error || 'Gagal memperbarui akun.'; }
  });
};
</script>
</body>
</html>
