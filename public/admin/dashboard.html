<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: { fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}, colors: { primary:'#2563EB', primaryHover:'#1D4ED8', slateDark:'#0F172A', slateMuted:'#64748B' } } } }</script>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="antialiased">
<div class="flex">
  <div id="admin-sidebar-root"></div>
  <main class="flex-1 p-8">
    <h1 class="text-2xl font-bold text-slateDark mb-1">Dashboard</h1>
    <p class="text-sm text-slateMuted mb-8">Ringkasan konten situs.</p>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10" id="stat-grid">
      <div class="admin-card p-5 skeleton h-24"></div>
      <div class="admin-card p-5 skeleton h-24"></div>
      <div class="admin-card p-5 skeleton h-24"></div>
      <div class="admin-card p-5 skeleton h-24"></div>
    </div>
    <div class="admin-card p-6">
      <h2 class="font-bold text-slateDark mb-4">Akses Cepat</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <a href="/admin/berita" class="admin-nav-item border border-slate-100"><i data-lucide="plus-circle" class="w-4 h-4"></i>Tulis Berita Baru</a>
        <a href="/admin/page-order" class="admin-nav-item border border-slate-100"><i data-lucide="list-ordered" class="w-4 h-4"></i>Atur Urutan Halaman</a>
        <a href="/admin/pengaturan" class="admin-nav-item border border-slate-100"><i data-lucide="key" class="w-4 h-4"></i>Ganti Password</a>
      </div>
    </div>
  </main>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  await initAdminPage('dashboard');
  try {
    const [store, berita, cs] = await Promise.all([
      api('/api/store-all'),
      api('/api/berita'),
      api('/api/custom-sections'),
    ]);
    const published = berita.items.filter((b) => b.status === 'published').length;
    const draft = berita.items.filter((b) => b.status !== 'published').length;
    document.getElementById('stat-grid').innerHTML = `
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Total Berita</p><p class="text-2xl font-bold text-slateDark">${berita.items.length}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Dipublikasikan</p><p class="text-2xl font-bold text-emerald-600">${published}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Draft/Terjadwal</p><p class="text-2xl font-bold text-amber-600">${draft}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Guru Terdaftar</p><p class="text-2xl font-bold text-slateDark">${(store.guru || []).length}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Program Unggulan</p><p class="text-2xl font-bold text-slateDark">${(store.program || []).length}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Foto Galeri</p><p class="text-2xl font-bold text-slateDark">${(store.galeri || []).length}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">Halaman Kustom</p><p class="text-2xl font-bold text-slateDark">${cs.items.length}</p></div>
      <div class="admin-card p-5"><p class="text-xs text-slateMuted mb-1">FAQ</p><p class="text-2xl font-bold text-slateDark">${(store.faq || []).length}</p></div>`;
    if (window.lucide) lucide.createIcons();
  } catch (e) { toast(e.message, 'error'); }
})();
</script>
</body>
</html>
