<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: {
  colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B' }
} } };</script>
</head>
<body class="bg-slate-50" data-section="dashboard">
<div id="admin-shell" class="min-h-screen flex"></div>
<script src="/admin/assets/admin.js"></script>
<script>
window.renderAdminSection = async function(main) {
  main.innerHTML = pageHeader('Dashboard', 'Ringkasan konten situs.') + '<div id="stat-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>';
  const data = await (await fetch('/api/admin/data')).json();
  const stats = [
    { label: 'Program', value: (data.program || []).length, icon: 'graduation-cap' },
    { label: 'Guru', value: (data.guru || []).length, icon: 'users' },
    { label: 'Prestasi', value: (data.prestasi || []).length, icon: 'trophy' },
    { label: 'Berita', value: (data.berita || []).length, icon: 'newspaper' },
    { label: 'Galeri', value: (data.galeri || []).length, icon: 'image' },
    { label: 'Testimoni', value: (data.testimoni || []).length, icon: 'quote' },
    { label: 'FAQ', value: (data.faq || []).length, icon: 'help-circle' },
    { label: 'Halaman Kustom', value: (data.customSections || []).length, icon: 'layout-template' }
  ];
  document.getElementById('stat-grid').innerHTML = stats.map(s => `
    <div class="bg-white rounded-2xl border border-slate-100 p-5">
      <i data-lucide="${s.icon}" class="w-6 h-6 text-primary mb-3"></i>
      <p class="text-2xl font-extrabold text-slateDark">${s.value}</p>
      <p class="text-xs text-slateMuted">${s.label}</p>
    </div>`).join('');
  window.lucide?.createIcons();
};
</script>
</body>
</html>
