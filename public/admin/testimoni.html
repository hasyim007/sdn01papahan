<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimoni Wali Murid - Admin SDN 01 Papahan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config = { theme: { extend: { fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']}, colors: { primary:'#2563EB', primaryHover:'#1D4ED8', slateDark:'#0F172A', slateMuted:'#64748B' } } } }</script>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="antialiased">
<div class="flex">
  <div id="admin-sidebar-root"></div>
  <main class="flex-1 p-8 max-w-3xl">
    <h1 class="text-2xl font-bold text-slateDark mb-1">Testimoni Wali Murid</h1>
    <p class="text-sm text-slateMuted mb-8">Ditampilkan di Beranda. Testimoni pertama dalam daftar yang tampil.</p>

    <div class="admin-card p-6 mb-6">
      <h2 class="font-bold text-slateDark mb-4">Judul Bagian</h2>
      <div id="header-form"></div>
      <button id="header-save" class="btn-primary">Simpan Judul</button>
    </div>
    <div class="admin-card p-6">
      <h2 class="font-bold text-slateDark mb-4">Daftar Testimoni</h2>
      <div id="list"></div>
    </div>
  </main>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  await initAdminPage('testimoni');
  try {
    const hf = document.getElementById('header-form');
    const hd = (await api('/api/store/testimoniHeader')).data || {};
    buildSimpleForm(hf, [{ key: 'title', label: 'Judul', type: 'text' }], hd);
    document.getElementById('header-save').addEventListener('click', async () => {
      try { await api('/api/store/testimoniHeader', { method: 'PUT', body: JSON.stringify({ data: readSimpleForm(hf) }) }); toast('Tersimpan'); }
      catch (e) { toast(e.message, 'error'); }
    });
    await buildArrayManager(document.getElementById('list'), 'testimoni', [
      { key: 'photo', label: 'Foto', type: 'image' },
      { key: 'quote', label: 'Isi Testimoni', type: 'textarea' },
      { key: 'name', label: 'Nama', type: 'text' },
      { key: 'role', label: 'Peran (mis. Wali Murid Kelas IV)', type: 'text' },
    ], { titleField: 'name', subtitleField: 'role', thumbField: 'photo' });
  } catch (e) { toast(e.message, 'error'); }
})();
</script>
</body>
</html>
