<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Sekolah - SDN 01 Papahan</title>
<meta name="description" content="Profil, visi, misi, dan fasilitas SDN 01 Papahan.">
<link rel="canonical" href="/profil">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
    colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B', surface: '#FFFFFF', borderLight: '#F1F5F9' },
    boxShadow: { soft: '0 4px 20px -2px rgba(0,0,0,0.05)', glass: '0 8px 32px 0 rgba(31,38,135,0.07)' }
} } }
</script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="antialiased overflow-x-hidden selection:bg-primary selection:text-white">
<div id="navbar-root"></div>
<main class="pt-32 pb-20">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8" id="content">
    <div class="skeleton h-8 w-40 mb-4"></div>
    <div class="skeleton h-10 w-2/3 mb-6"></div>
    <div class="skeleton h-24 w-full"></div>
  </div>
</main>
<div id="footer-root"></div>

<script src="/assets/js/site.js"></script>
<script>
initPublicPage('profil', async (store) => {
  const p = store.profil || {};
  document.getElementById('content').innerHTML = `
    <span class="text-xs font-semibold text-primary">${escHtml(p.eyebrow || '')}</span>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-slateDark mt-2 mb-6">${escHtml(p.title || '')}</h1>
    <p class="text-slateMuted mb-10">${escHtml(p.desc || '')}</p>
    <div class="grid md:grid-cols-2 gap-8 mb-10">
      <div class="inst-card p-6">
        <h2 class="font-bold text-slateDark mb-3 flex items-center gap-2"><i data-lucide="target" class="w-5 h-5 text-primary"></i>Visi</h2>
        <p class="text-sm text-slateMuted">${escHtml(p.visi || '')}</p>
      </div>
      <div class="inst-card p-6">
        <h2 class="font-bold text-slateDark mb-3 flex items-center gap-2"><i data-lucide="list-checks" class="w-5 h-5 text-primary"></i>Misi</h2>
        <ul class="space-y-2 text-sm text-slateMuted list-disc pl-5">
          ${(p.misi || []).map(m => `<li>${escHtml(m)}</li>`).join('')}
        </ul>
      </div>
    </div>
    <div class="inst-card p-6">
      <h2 class="font-bold text-slateDark mb-3 flex items-center gap-2"><i data-lucide="building-2" class="w-5 h-5 text-primary"></i>Fasilitas</h2>
      <p class="text-sm text-slateMuted">${escHtml(p.fasilitas || '')}</p>
    </div>`;
});
</script>
</body>
</html>
