<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Kegiatan - SDN 01 Papahan</title>
<meta name="description" content="Galeri foto kegiatan SDN 01 Papahan.">
<link rel="canonical" href="/galeri">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
    colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B', surface: '#FFFFFF', borderLight: '#F1F5F9' },
    boxShadow: { soft: '0 4px 20px -2px rgba(0,0,0,0.05)', glass: '0 8px 32px 0 rgba(31,38,135,0.07)' }
} } }
</script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="antialiased overflow-x-hidden selection:bg-primary selection:text-white">
<div id="navbar-root"></div>
<main class="pt-32 pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-12" id="header">
      <div class="skeleton h-9 w-1/2 mx-auto"></div>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="galeri-grid"></div>
  </div>
</main>
<div id="footer-root"></div>

<script src="/assets/js/site.js"></script>
<script>
initPublicPage('galeri', async (store) => {
  const h = store.galeriHeader || {};
  document.getElementById('header').innerHTML = `<h1 class="text-3xl font-bold text-slateDark">${escHtml(h.title || '')}</h1>`;
  document.getElementById('galeri-grid').innerHTML = (store.galeri || []).map(g => `
    <div class="relative rounded-2xl overflow-hidden group">
      <img src="${escHtml(g.image)}" class="w-full h-56 object-cover group-hover:scale-105 transition duration-300">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4">
        <p class="text-white text-sm font-medium">${escHtml(g.caption || '')}</p>
      </div>
    </div>`).join('') || '<p class="text-slateMuted col-span-3 text-center">Belum ada foto.</p>';
});
</script>
</body>
</html>
