<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestasi & Ekstrakurikuler - SDN 01 Papahan</title>
<meta name="description" content="Prestasi siswa dan daftar ekstrakurikuler SDN 01 Papahan.">
<link rel="canonical" href="/prestasi">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
    colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B', surface: '#FFFFFF', borderLight: '#F1F5F9' },
    boxShadow: { soft: '0 4px 20px -2px rgba(0,0,0,0.05)', glass: '0 8px 32px 0 rgba(31,38,135,0.07)' }
} } }
</script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="antialiased overflow-x-hidden selection:bg-primary selection:text-white">
<div id="navbar-root"></div>
<main class="pt-32 pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-12" id="header">
      <div class="skeleton h-6 w-32 mx-auto mb-3"></div>
      <div class="skeleton h-9 w-2/3 mx-auto"></div>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-20" id="prestasi-grid"></div>

    <div class="text-center max-w-2xl mx-auto mb-12" id="ekskul-header">
      <div class="skeleton h-9 w-1/2 mx-auto"></div>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6" id="ekskul-grid"></div>
  </div>
</main>
<div id="footer-root"></div>

<script src="/assets/js/site.js"></script>
<script>
initPublicPage('prestasi', async (store) => {
  const h = store.prestasiHeader || {};
  document.getElementById('header').innerHTML = `
    <span class="text-xs font-semibold text-primary">${escHtml(h.eyebrow || '')}</span>
    <h1 class="text-3xl font-bold text-slateDark mt-2">${escHtml(h.titlePrefix || '')} <span class="text-primary">${escHtml(h.titleHighlight || '')}</span></h1>
    <p class="text-slateMuted mt-3">${escHtml(h.subtitle || '')}</p>`;
  document.getElementById('prestasi-grid').innerHTML = (store.prestasi || []).map(p => `
    <div class="inst-card overflow-hidden">
      <img src="${escHtml(p.photo || 'https://images.unsplash.com/photo-1526676037777-05a232554f77?auto=format&fit=crop&q=80&w=400&h=300')}" class="w-full h-36 object-cover">
      <div class="p-4">
        <span class="text-[10px] font-bold text-primary tracking-wide">${escHtml(p.badge || '')}</span>
        <h3 class="font-bold text-sm text-slateDark mt-1 mb-1">${escHtml(p.title)}</h3>
        <p class="text-xs text-slateMuted">${escHtml(p.studentName || '')} &bull; ${escHtml(p.date || '')}</p>
      </div>
    </div>`).join('') || '<p class="text-slateMuted col-span-4 text-center">Belum ada data.</p>';

  const eh = store.ekskulHeader || {};
  document.getElementById('ekskul-header').innerHTML = `
    <h2 class="text-3xl font-bold text-slateDark">${escHtml(eh.title || '')}</h2>
    <p class="text-slateMuted mt-3">${escHtml(eh.subtitle || '')}</p>`;
  document.getElementById('ekskul-grid').innerHTML = (store.ekskul || []).map(e => `
    <div class="inst-card p-6 text-center">
      <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center mx-auto mb-4"><i data-lucide="${escHtml(e.icon || 'star')}" class="w-6 h-6 text-primary"></i></div>
      <h3 class="font-bold text-sm text-slateDark mb-1">${escHtml(e.name)}</h3>
      <p class="text-xs text-slateMuted">${escHtml(e.status || '')}</p>
    </div>`).join('') || '<p class="text-slateMuted col-span-4 text-center">Belum ada data.</p>';
});
</script>
</body>
</html>
