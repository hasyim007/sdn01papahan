<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SDN 01 Papahan</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/tailwind.css">
    <script src="https://unpkg.com/lucide@1.31.0" defer></script>
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; }
        .shadow-glass { box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08); }
        .hidden-important { display: none !important; }
    </style>
</head>
<body>

<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <a href="/" class="inline-flex items-center gap-1.5 text-sm text-slateMuted hover:text-slateDark mb-6 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke beranda
        </a>
        <div class="bg-white rounded-2xl shadow-glass p-8">
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white mb-5">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold text-slateDark mb-1">Masuk</h2>
            <p class="text-sm text-slateMuted mb-6">Khusus admin, guru, dan staf untuk mengelola konten website sekolah.</p>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slateDark mb-1">Username</label>
                    <input type="text" id="login-username" autocomplete="username" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slateDark mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" autocomplete="current-password" class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors text-sm" placeholder="••••••••" required>
                        <button type="button" onclick="togglePasswordVisibility('login-password', this)" aria-label="Tampilkan password" class="absolute inset-y-0 right-0 px-3 flex items-center text-slateMuted hover:text-slateDark">
                            <i data-lucide="eye" class="w-4 h-4 pointer-events-none"></i>
                        </button>
                    </div>
                </div>
                <p id="login-error" class="hidden-important text-xs text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2">Username atau password salah.</p>
                <button type="submit" id="login-submit-btn" class="w-full px-4 py-2.5 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primaryHover transition-colors shadow-soft flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Masuk
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });

// Tombol mata untuk lihat/sembunyikan isi field password -- membantu
// mengantisipasi salah ketik sebelum submit, alih-alih baru ketahuan
// setelah gagal login. Dipakai generik lewat id field + tombolnya sendiri,
// supaya bisa dipakai ulang di field password lain kalau perlu.
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const icon = btn.querySelector('i');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    if (icon) icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
    btn.setAttribute('aria-label', showing ? 'Tampilkan password' : 'Sembunyikan password');
    if (window.lucide) lucide.createIcons();
}

// Kalau ternyata sudah punya sesi admin yang masih berlaku (mis. buka tab baru),
// langsung lempar ke dashboard tanpa perlu login ulang. Verifikasi SELALU ke server,
// bukan localStorage/sessionStorage, supaya tidak bisa dipalsukan dari console browser.
(async function checkExistingSession() {
    try {
        const res = await fetch('/api/session', { credentials: 'same-origin' });
        if (res.ok) window.location.replace('/admin');
    } catch (e) { /* abaikan, biarkan user login manual */ }
})();

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-submit-btn');
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden-important');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    btn.disabled = true;
    btn.classList.add('opacity-60');
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (res.ok) {
            window.location.replace('/admin');
            return;
        }
        // BARU V3: tampilkan pesan asli dari server (mis. "Akun terkunci
        // sementara..." atau "Terlalu banyak percobaan login dari jaringan
        // Anda...") supaya admin tahu kalau itu rate-limit/lockout, bukan
        // sekadar salah ketik password.
        const body = await res.json().catch(() => ({}));
        errorEl.textContent = body.error || 'Username atau password salah.';
        errorEl.classList.remove('hidden-important');
    } catch (err) {
        errorEl.textContent = 'Tidak bisa menghubungi server. Coba lagi.';
        errorEl.classList.remove('hidden-important');
    } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-60');
    }
}
</script>
</body>
</html>
