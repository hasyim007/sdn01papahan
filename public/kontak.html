<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ & Kontak - SDN 01 Papahan</title>
<meta name="description" content="Pertanyaan umum dan informasi kontak SDN 01 Papahan.">
<link rel="canonical" href="/kontak">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
    colors: { primary: '#2563EB', primaryHover: '#1D4ED8', slateDark: '#0F172A', slateMuted: '#64748B', surface: '#FFFFFF', borderLight: '#F1F5F9' },
    boxShadow: { soft: '0 4px 20px -2px rgba(0,0,0,0.05)', glass: '0 8px 32px 0 rgba(31,38,135,0.07)' }
} } }
</script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="antialiased overflow-x-hidden selection:bg-primary selection:text-white">
<div id="navbar-root"></div>
<main class="pt-32 pb-20">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-12"><h1 class="text-3xl font-bold text-slateDark">FAQ & Kontak</h1></div>
    <div class="grid md:grid-cols-2 gap-10">
      <div class="space-y-4" id="faq-list"></div>
      <div class="inst-card p-6 h-fit" id="kontak-card"></div>
    </div>
  </div>
</main>
<div id="footer-root"></div>

<script src="/assets/js/site.js"></script>
<script>
initPublicPage('faq', async (store) => {
  document.getElementById('faq-list').innerHTML = (store.faq || []).map(f => `
    <details class="inst-card p-5">
      <summary class="font-semibold text-slateDark cursor-pointer">${escHtml(f.q)}</summary>
      <p class="text-sm text-slateMuted mt-3">${escHtml(f.a)}</p>
    </details>`).join('') || '<p class="text-slateMuted">Belum ada FAQ.</p>';

  const k = store.kontak || {};
  document.getElementById('kontak-card').innerHTML = `
    <h2 class="font-bold text-slateDark mb-4">Informasi Kontak</h2>
    <div class="space-y-4 text-sm text-slateMuted">
      <div class="flex gap-3"><i data-lucide="map-pin" class="w-5 h-5 text-primary flex-shrink-0"></i><span>${escHtml(k.address || '')}</span></div>
      <div class="flex gap-3"><i data-lucide="phone" class="w-5 h-5 text-primary flex-shrink-0"></i><span>${escHtml(k.phone || '')}</span></div>
      <div class="flex gap-3"><i data-lucide="mail" class="w-5 h-5 text-primary flex-shrink-0"></i><span>${escHtml(k.email || '')}</span></div>
    </div>`;
});
</script>
</body>
</html>
