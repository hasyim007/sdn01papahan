name = "sdn01papahan"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Static assets (HTML/CSS/JS) yang di-hosting langsung oleh Worker ini.
# PENTING: default Cloudflare adalah asset statis MENANG lebih dulu — kalau path cocok
# file di folder "public" (termasuk "/" -> public/index.html), request itu TIDAK PERNAH
# sampai ke src/index.js. Karena hampir semua isi situs sekarang memang harus diputuskan
# oleh src/index.js (SSR per halaman + fallback ke index.html buat /admin), Worker WAJIB
# selalu jalan duluan untuk SEMUA request — makanya run_worker_first di-set true (bukan
# cuma untuk "/"), lalu src/index.js sendiri yang memanggil env.ASSETS.fetch() secara
# eksplisit untuk path yang belum ada rute SSR-nya.
#
# not_found_handling="single-page-application": supaya PANGGILAN env.ASSETS.fetch() di
# atas (dari dalam src/index.js, untuk /admin dan tautan #hash lama) balikin index.html
# (200), bukan 404 — bukan untuk request langsung dari browser (karena run_worker_first
# sudah true, browser tidak pernah menyentuh asset-serving Cloudflare secara langsung).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sdn01papahan"
database_id = "081f2186-f3b7-48cd-9b17-a38fa3bdb1be"

[vars]
ALLOWED_ORIGIN = "https://sdn01papahan.sch.id"
# SYNC_KEY sengaja TIDAK ditaruh di sini — set lewat:
#   wrangler secret put SYNC_KEY
# atau lewat Dashboard > Worker > Settings > Variables and Secrets (tipe: Secret)
