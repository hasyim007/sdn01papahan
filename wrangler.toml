name = "sdn01papahan"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static Assets (situs publik + panel admin sebagai file HTML statis).
# Worker (src/index.js) di-set sebagai "run_worker_first" untuk route tertentu
# supaya /berita*, /[slug-custom], /api/*, /sitemap.xml, /robots.txt bisa
# ditangani secara dinamis SEBELUM fallback ke file statis di /public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Catatan: "/*" disertakan karena halaman kustom (/[slug-custom]) punya path
# yang tidak diketahui di awal — Worker mengecek dulu apakah path itu file
# statis yang match; kalau bukan, dicoba resolve sebagai slug custom section
# dari D1, baru 404 jika benar-benar tidak ada.

[[d1_databases]]
binding = "DB"
database_name = "sdn01papahan"
database_id = "0fb4b5b2-96cc-4829-811b-df14579f8ea0"

[vars]
# Ganti dengan domain produksi Anda setelah deploy (dipakai untuk sitemap & OG tags)
SITE_URL = "https://sdn01papahan.example.workers.dev"
