name = "sdn01papahan"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Static assets (HTML/CSS/JS) yang di-hosting langsung oleh Worker ini.
# Secara default, request yang cocok dengan file di folder "public" akan
# disajikan LANGSUNG tanpa menjalankan src/index.js.
#
# Kekecualian penting: "run_worker_first" membuat path-path tertentu tetap
# lewat Worker DULU sebelum file statisnya dikirim. Dipakai untuk dua hal:
#  1. Melindungi /admin.html — Worker mengecek cookie sesi login lebih dulu;
#     kalau tidak valid, browser dialihkan ke /login.html dan ISI DASHBOARD
#     TIDAK PERNAH terkirim ke browser tersebut sama sekali (bukan cuma
#     disembunyikan lewat CSS/JS, tapi memang tidak pernah dikirim server).
#  2. (BARU V3) "/", "/index.html", "/login.html" didaftarkan juga supaya
#     Worker sempat menambahkan header keamanan (Content-Security-Policy,
#     X-Frame-Options, dst — lihat withSecurityHeaders() di src/index.js)
#     ke halaman publik, bukan cuma ke admin.html.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/login.html", "/admin.html", "/admin", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sdn01papahan"
database_id = "00938b0f-c1bc-4433-8405-0b83d57f7dcb"

[vars]
# Origin resmi situs ini (dipakai untuk header CORS). Sesuaikan dengan
# domain asli Anda; kalau masih di *.workers.dev, isi origin workers.dev-nya.
ALLOWED_ORIGIN = "https://sdn01papahan.sch.id"

# Catatan: mekanisme SYNC_KEY / X-Sync-Key lama SUDAH TIDAK DIPAKAI.
# Otorisasi sekarang memakai sesi login (cookie HttpOnly) yang dibuat oleh
# POST /api/login setelah verifikasi username+password ke tabel admin_users
# di D1 (lihat schema.sql). Tidak ada secret yang perlu di-set manual lagi.
